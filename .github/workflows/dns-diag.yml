name: dns-diag
# One measurement, no result kept: the answer mix of the sweep's questions through differently set resolvers (tools/dns_diag.py).
on:
  workflow_dispatch:
    inputs:
      place:
        description: "place in the list to take the names from"
        default: "30000000"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install -q dnspython duckdb
      - name: Names
        run: |
          python3 tools/dns_diag.py slice --place "${{ inputs.place }}" --n 90000 --out /tmp/slice.txt
      - name: Phases
        run: |
          # 2026-11-10, two measurements: whatever the resolver's settings, and also when the public resolvers were asked directly with a
          # new socket per question, a runner got ~52 answers a second and the rest timed out. This run: the public resolvers over ONE
          # socket per worker thread (tools/dns_services.py SteadyResolver) — a few hundred flows for the whole run.
          echo "--- 1. one socket per worker, 250 questions a second"
          python3 tools/dns_diag.py steady --names /tmp/slice.txt --skip 0 --n 15000 --qps 250 --label "1. steady, 250/s"
          echo "--- 2. one socket per worker, 500 questions a second"
          python3 tools/dns_diag.py steady --names /tmp/slice.txt --skip 15000 --n 25000 --qps 500 --label "2. steady, 500/s"
          echo "--- 3. one socket per worker, 900 questions a second"
          python3 tools/dns_diag.py steady --names /tmp/slice.txt --skip 40000 --n 30000 --qps 900 --label "3. steady, 900/s"
          echo "--- 4. the lookup's questions (name servers, TXT, MX, address), 500 questions a second"
          python3 tools/dns_diag.py steady --names /tmp/slice.txt --skip 70000 --n 5000 --qps 500 --types NS,TXT,MX,A --label "4. steady, NS+TXT+MX+A, 500/s"
          echo "--- 5. as before: a new socket for every question, public resolvers, 250 a second"
          python3 tools/dns_diag.py ask --names /tmp/slice.txt --skip 75000 --n 8000 --qps 250 --label "5. new socket per question, 250/s"
          echo "--- 6. one socket per worker again, 500 questions a second (after the flood of new sockets)"
          python3 tools/dns_diag.py steady --names /tmp/slice.txt --skip 83000 --n 7000 --qps 500 --label "6. steady again, 500/s"
