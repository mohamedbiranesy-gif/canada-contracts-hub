name: dns-diag
# One measurement, no result kept: the answer mix of the sweep's questions through differently set resolvers (tools/dns_diag.py).
on:
  workflow_dispatch:
    inputs:
      place:
        description: "place in the list to take the names from"
        default: "30000000"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install -q dnspython duckdb
      - name: Names
        run: |
          python3 tools/dns_diag.py slice --place "${{ inputs.place }}" --n 90000 --out /tmp/slice.txt
      - name: Phases
        run: |
          # fifth measurement: how many questions a second the forwarding resolver (TLS to the public resolvers) carries from one runner
          pip install -q "httpx[http2]"
          sudo apt-get install -y -q unbound >/dev/null 2>&1 || true
          sudo systemctl stop unbound 2>/dev/null || true
          conf() {  # <threads> <tcp streams per thread>
            printf '%s\n' 'server:' '  interface: 127.0.0.1' '  port: 5353' '  access-control: 127.0.0.0/8 allow' '  do-ip6: no' "  num-threads: $1" \
              '  msg-cache-size: 256m' '  rrset-cache-size: 512m' '  num-queries-per-thread: 4096' "  outgoing-num-tcp: $2" '  module-config: "iterator"' \
              '  tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"' '  hide-identity: yes' '  hide-version: yes' '  verbosity: 0' \
              'forward-zone:' '  name: "."' '  forward-tls-upstream: yes' '  forward-addr: 1.1.1.1@853#cloudflare-dns.com' '  forward-addr: 1.0.0.1@853#cloudflare-dns.com' \
              '  forward-addr: 8.8.8.8@853#dns.google' '  forward-addr: 8.8.4.4@853#dns.google' '  forward-addr: 9.9.9.9@853#dns.quad9.net' | sudo tee /etc/unbound/unbound.conf >/dev/null
            sudo pkill -x unbound 2>/dev/null || true; sleep 2
            sudo unbound -c /etc/unbound/unbound.conf; sleep 3
          }
          echo "--- 1. forwarded over TLS, 4 threads x 64 streams, 500 questions a second"
          conf 4 64
          timeout 900 python3 tools/dns_diag.py ask --names /tmp/slice.txt --skip 0 --n 20000 --qps 500 --resolver 127.0.0.1:5353 --label "1. TLS forward, 500/s" || echo "phase 1 did not finish"
          echo "--- 2. forwarded over TLS, 4 threads x 64 streams, 900 questions a second"
          conf 4 64
          timeout 900 python3 tools/dns_diag.py ask --names /tmp/slice.txt --skip 20000 --n 27000 --qps 900 --workers 500 --resolver 127.0.0.1:5353 --label "2. TLS forward, 900/s" || echo "phase 2 did not finish"
          echo "--- 3. forwarded over TLS, 4 threads x 256 streams, 900 questions a second"
          conf 4 256
          timeout 900 python3 tools/dns_diag.py ask --names /tmp/slice.txt --skip 47000 --n 27000 --qps 900 --workers 500 --resolver 127.0.0.1:5353 --label "3. TLS forward, 256 streams, 900/s" || echo "phase 3 did not finish"
          echo "--- 4. over HTTPS (HTTP/2), 600 questions a second"
          timeout 900 python3 tools/dns_diag.py steady --doh --names /tmp/slice.txt --skip 74000 --n 16000 --qps 600 --connections 8 --label "4. HTTPS, 600/s" || echo "phase 4 did not finish"
