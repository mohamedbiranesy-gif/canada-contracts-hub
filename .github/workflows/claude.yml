name: claude
# @claude in any issue/PR comment, plus a weekly integrator run. Needs secret CLAUDE_CODE_OAUTH_TOKEN
# (run `claude setup-token` once) or ANTHROPIC_API_KEY. Without either, this workflow does nothing.
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  issues: { types: [opened] }
  schedule:
    - cron: "11 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  claude:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body || '', '@claude') || contains(github.event.issue.body || '', '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Credential present?
        id: key
        env: { A: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}", B: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: echo "ok=$([ -n "$A$B" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'yes'
        with: { fetch-depth: 1 }
      - name: Claude (mention)
        if: steps.key.outputs.ok == 'yes' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Claude (weekly integrator)
        if: steps.key.outputs.ok == 'yes' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Follow prompts/claude_integrator.md. Commit coordination changes directly to main; open PRs for code changes."
          claude_args: |
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
