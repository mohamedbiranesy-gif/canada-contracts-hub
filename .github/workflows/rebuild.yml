name: rebuild-dataset
# Daily: advance the reference date to today, then patch the published dataset with verified team findings,
# harvester progress (websites, BC registrations, SEAO end dates) and validated new-source records
# (matched to existing vendor/buyer enrichment), and republish it. Contracts whose end date has passed move out.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download current release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/release
          for a in canadian_vendor_contracts vendors_enriched buyers_enriched; do
            gh release download dataset-latest -D data/release -p "$a.jsonl.gz"
          done
          for a in seao_api_notices vendors_web_progress vendors_orgbook_xp_progress; do
            gh release download harvest-state -D data/release -p "$a.jsonl.gz" || true
          done
      - name: Advance reference date to today
        run: |
          python3 - <<'PY'
          import datetime, json
          c = json.load(open("coord/config.json"))
          c["reference_date"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          json.dump(c, open("coord/config.json", "w"), indent=2)
          print("reference date", c["reference_date"])
          PY
      - name: Patch
        run: |
          python3 tools/patch_dataset.py data/release data/build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +%Y%m%d)
          cp data/build/ended_since_last_build.jsonl.gz "data/build/ended_${stamp}.jsonl.gz"
          gh release upload dataset-latest data/build/canadian_vendor_contracts.jsonl.gz data/build/patch_report.json "data/build/ended_${stamp}.jsonl.gz" --clobber
          # commit only the two files this workflow owns, on top of the latest main (no rebase, no conflicts)
          cp coord/config.json /tmp/config.json; cp coord/dataset_summary.json /tmp/dataset_summary.json
          git config user.name "rebuild-bot"; git config user.email "rebuild-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'PY'
          import json
          live = json.load(open("coord/config.json")); mine = json.load(open("/tmp/config.json"))
          live["reference_date"] = mine["reference_date"]
          json.dump(live, open("coord/config.json", "w"), indent=2)
          PY
            cp /tmp/dataset_summary.json coord/dataset_summary.json
            git add coord/config.json coord/dataset_summary.json
            git diff --cached --quiet && break
            git commit -q -m "rebuild: dataset patched ${stamp} [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((i * 7))
          done
          gh workflow run verify-and-merge.yml --ref main || true
