name: rebuild-dataset
# Patches the published dataset with verified team findings, SEAO end dates and validated new-source records,
# then republishes release assets. Weekly, or on demand.
on:
  schedule:
    - cron: "37 6 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: main-writer, cancel-in-progress: false }
jobs:
  rebuild:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download current release assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p data/release
          gh release download dataset-latest -D data/release -p 'canadian_vendor_contracts.jsonl.gz'
          for a in seao_api_notices vendors_web_progress vendors_orgbook_xp_progress; do
            gh release download harvest-state -D data/release -p "$a.jsonl.gz" || true
          done
      - name: Patch
        run: python3 tools/patch_dataset.py data/release data/build && python3 tools/status_board.py > /dev/null
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          stamp=$(date -u +%Y%m%d)
          gh release upload dataset-latest data/build/canadian_vendor_contracts.jsonl.gz data/build/patch_report.json --clobber
          gh release upload dataset-latest "data/build/ended_since_last_build.jsonl.gz#ended_since_last_build_${stamp}.jsonl.gz" --clobber || true
          git config user.name "rebuild-bot"; git config user.email "rebuild-bot@users.noreply.github.com"
          git add coord/dataset_summary.json coord/STATUS_BOARD.md
          git diff --cached --quiet || { git commit -q -m "rebuild: dataset patched ${stamp} [skip ci]"; git pull -q --rebase origin main; git push -q origin HEAD:main; }
