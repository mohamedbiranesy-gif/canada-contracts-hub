name: rank-buyers
# The deliverable: one row per distinct buyer, ranked by proof of an active relationship with a Canada-located supplier
# and by the quality of its invoicing contact, split into quality batches (contrib/claude/rank_buyers/README.md).
# Rebuilt from the latest dataset release and the referee's confirmed mailboxes, so the batches stay current without
# anyone running them by hand. Output: the release "ranked-latest" (ranked_buyers.csv.gz, ranked_batches.zip, ranked_contracts.zip, ranked_extras.zip,
# BUILD.json) and coord/results/ranked/ (SUMMARY.md, VALIDATION.md, AUDIT.md …, WHERE.md, BUILD.json, batches_head/).
#
# One process ranks the whole table here. rank-buyers-parts.yml ranks it on several runners and puts the parts together; both use
# tools/rank_prep.sh (before the table) and tools/rank_tail.sh (after it), and share one concurrency group, so they never run at the same time.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 40 minutes at 170,000 rows (2026-11-10), 18 of them the DNS-posture step; the row count is meant to grow sixfold
    concurrency: { group: ranker, cancel-in-progress: false }  # own group: a queued referee run must not cancel it
    steps:
      # main as it is when the job STARTS: a run that waited behind another build (2026-11-10: 70 minutes in the queue) used to build the
      # commit it was dispatched on — the same inputs again — and then could not put its folder on top of the build that had landed meanwhile
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Rank, split into batches, publish, commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q dnspython
          df -h / /mnt 2>/dev/null | sed 's/^/disk at start:      /' || true
          mkdir -p data/release
          gh release download dataset-latest -p canadian_vendor_contracts.jsonl.gz -p vendors_enriched.jsonl.gz -p buyers_enriched.jsonl.gz \
            -p vendor_country_unverified_contracts.jsonl.gz -p 'ended_2*.jsonl.gz' -D data/release --clobber
          bash tools/rank_prep.sh
          python3 contrib/claude/rank_buyers/rank.py > rank.log || { tail -40 rank.log; exit 1; }
          grep -E "^\[ *[0-9]+s .*\] (same-vendor carry-over|rows [0-9]+)" rank.log | cut -c1-60 || true   # time and memory at the end of the ranking
          bash tools/rank_tail.sh
