name: mailbox-crawl
# The step that turns a relationship into a delivered row: each lead's own site is read for its role mailbox (tools/lead_crawl.py), the rows go
# to the referee, the next rank build delivers them. Until 2026-11-10 this ran as the last stage of the row factory and waited for the
# extraction and address passes of each cycle; it now runs back to back on its own runners.
# Queue order: sites whose home page prints a role mailbox (scan detector 4) first — leads of every kind, then registry candidates (.ca sites,
# tier R) — then the other leads. robots.txt respected, 1 request per second per site, identified user agent. No AI, no search engine.
on:
  schedule:
    - cron: "9 * * * *"      # a new run is queued every hour and starts when the one before it ends (one run at a time)
  workflow_dispatch:
    inputs:
      shards:
        description: "parallel runners (1-10)"
        default: "6"
      minutes:
        description: "minutes per runner"
        default: "90"
      registry:
        description: "registry candidates per runner (.ca sites whose home page prints a role mailbox)"
        default: "8000"
permissions:
  contents: write
  actions: write
concurrency:
  group: mailbox-crawl
  cancel-in-progress: false
env:
  SHARDS: ${{ inputs.shards || '6' }}   # 2026-11-10: 6 runners x 90 minutes — the account runs 20 jobs at a time; shorter runs free slots sooner for the referee, the ranker and the merges
  MINUTES: ${{ inputs.minutes || '90' }}
  REGISTRY: ${{ inputs.registry || '8000' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      stamp: ${{ steps.m.outputs.stamp }}
    steps:
      - id: m
        run: |
          python3 -c "import os; n=max(1,min(10,int(os.environ['SHARDS']))); print('matrix=' + str(list(range(n))))" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
      - name: Read each lead's own site for its role mailbox
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          # Shopify stores ride along (2026-11-10). Every store sits on Shopify's network, which counts requests per reader: a runner sends it 2 requests
          # a second through one queue, whatever else the runner does. That queue is idle capacity on every runner of this crawl, so the stores are
          # read here by a second process (its own folder, its own outputs) instead of holding runners of their own. Shopify Inc. (Ottawa) is the
          # contracting party of stores in Canada and the United States; stores elsewhere end after one request (/meta.json gives the country).
          mkdir -p stores
          if [ -s data/incoming/claude/claude_tenant_candidates.csv.gz ]; then
            ( cd stores && python3 ../tools/lead_crawl.py --candidates ../data/incoming/claude/claude_tenant_candidates.csv.gz --vendors shopify --shard ${{ matrix.k }}/$SHARDS --minutes $M --workers 8 --max-pages 12 --dns-stores 4000 > store.log 2>&1 ) &
          fi
          python3 tools/lead_crawl.py --leads data/incoming/claude/claude_buyer_leads_cc.csv,data/incoming/claude/claude_buyer_leads.csv --shard ${{ matrix.k }}/$SHARDS --minutes $M --workers 40 --max-pages 25 --registry "$REGISTRY"
          wait || true
          echo "--- stores"; grep -E "queued|candidate sites to read|finished" stores/store.log | tail -4 || true
      - uses: actions/upload-artifact@v4
        with: { name: "mc-${{ matrix.k }}", path: out/, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: "mcs-${{ matrix.k }}", path: stores/out/, retention-days: 3, if-no-files-found: ignore }

  merge:
    needs: [plan, crawl]
    if: ${{ always() && needs.crawl.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "mc-*", path: shards, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "mcs-*", path: stores, merge-multiple: true }
      - name: Append the mailbox rows, commit, and call the referee
        env: { GH_TOKEN: "${{ github.token }}", STAMP: "${{ needs.plan.outputs.stamp }}" }
        run: |
          ls -la shards | head -40 || true
          git config user.name "mailbox-crawl"; git config user.email "mailbox-crawl@users.noreply.github.com"
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -q -fd data/incoming/claude/crawl_state data/incoming/claude/tenant_state data/incoming/claude/site_facts
            python3 tools/lead_crawl.py --merge shards --stamp "$STAMP" | tee /tmp/crawl.txt
            if ls stores/tenant_done_*.tsv > /dev/null 2>&1; then   # the stores read alongside: accepted leads + their mailbox rows + done lines (tenant_state/)
              python3 tools/cc_tenants.py merge-accepted stores --stamp "$STAMP" | tee /tmp/stores.txt
              python3 tools/lead_crawl.py --merge stores --tenants --stamp "$STAMP" | tee -a /tmp/stores.txt
              git add data/incoming/claude/tenant_state 2>/dev/null || true
            fi
            git add data/incoming/claude/crawl_state 2>/dev/null || true
            git add data/incoming/claude/site_facts 2>/dev/null || true   # the sites' own name / address / licence number: append-only shards since 2026-11-10
            git add data/incoming/claude/claude_buyer_ap_results_cccrawl*.csv 2>/dev/null || true   # the results file rotates at 30 MB (cccrawl01, 02 …)
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "[claude] mailbox-crawl: role mailboxes of lead buyers ($(tail -1 /tmp/crawl.txt | cut -c1-110))"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          cat /tmp/crawl.txt /tmp/stores.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # pushes made with the workflow token do not start other workflows: call the referee, which re-fetches every evidence page
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/verify-and-merge.yml/dispatches" -f ref=main || true
