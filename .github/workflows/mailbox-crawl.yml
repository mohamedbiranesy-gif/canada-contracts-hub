name: mailbox-crawl
# The step that turns a relationship into a delivered row: each lead's own site is read for its role mailbox (tools/lead_crawl.py), the rows go
# to the referee, the next rank build delivers them. Until 2026-11-10 this ran as the last stage of the row factory and waited for the
# extraction and address passes of each cycle; it now runs back to back on its own runners.
# Queue order: sites whose home page prints a role mailbox (scan detector 4) first — leads of every kind, then registry candidates (.ca sites,
# tier R) — then the other leads. robots.txt respected, 1 request per second per site, identified user agent. No AI, no search engine.
on:
  schedule:
    - cron: "9 * * * *"      # a new run is queued every hour and starts when the one before it ends (one run at a time)
  workflow_dispatch:
    inputs:
      shards:
        description: "parallel runners (1-10)"
        default: "8"
      minutes:
        description: "minutes per runner"
        default: "150"
      registry:
        description: "registry candidates per runner (.ca sites whose home page prints a role mailbox)"
        default: "20000"
permissions:
  contents: write
  actions: write
concurrency:
  group: mailbox-crawl
  cancel-in-progress: false
env:
  # 8 runners (2026-11-11 13:24Z; was 6). They were raised for the store reader, which is gone since 19Z (see the crawl step); they stay for the
  # sites of the register, roster, dealer and contract lanes.
  SHARDS: ${{ inputs.shards || '8' }}
  # 2026-11-11: 150 minutes a run (was 90). The store reader rides on these runners at a fixed rate per runner, and the certificate logs are
  # bringing stores by the hundred thousand: what counts for it is the share of the day the runners are up. A cycle of 90 minutes lost 20 to 60
  # minutes between runs (queue, start, merge) — 60 to 80 % of the day; the same pauses on 150 minutes leave 85 to 90 %.
  MINUTES: ${{ inputs.minutes || '150' }}
  REGISTRY: ${{ inputs.registry || '20000' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      stamp: ${{ steps.m.outputs.stamp }}
    steps:
      - id: m
        run: |
          python3 -c "import os; n=max(1,min(10,int(os.environ['SHARDS']))); print('matrix=' + str(list(range(n))))" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
      - name: Read each lead's own site for its role mailbox
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          # 200 sites at a time per runner (2026-11-11; 40, then 120 on 2026-11-10): a site is asked at most once a second and takes ~25 seconds, so the
          # number of sites read is the number of sites open at once; measured, a page costs 23 ms of CPU and a runner at 120 used a third of one core.
          #
          # 2026-11-11 19Z — no store reader here any more. The owner's requirement (13:09 and 13:58 EST): "it needs to be bank transfers relationship
          # not credit card … if it's not on invoice, by bank transfer then it's no … Shopify is over saturated in this way". Shopify charges the card
          # on file (its own terms), so a store is not a row; the second process that read stores on these runners is gone, and with it the 2 requests
          # a second each runner sent to Shopify's network. What these runners read now: the sites of organisations named by a register, a member
          # roster, a dealer list or a contract record — relationships billed on invoice — and the .ca sites that print a role mailbox (the pool of
          # organisations with a name, an address and a mailbox on file, which the register lanes are matched against).
          #
          # A reader that stops altogether (two runs on 2026-11-11 lost one runner in six, 200 minutes each): tools/lead_crawl.py now ends itself
          # when no site has finished for ten minutes and prints every thread's stack; it is started again here for the minutes that are left and
          # leaves out the sites that were open when it stopped. What was read before is on disk and is uploaded whatever happens (if: always()).
          END=$(( $(date +%s) + M * 60 ))
          while :; do
            LEFT=$(( (END - $(date +%s)) / 60 ))
            [ "$LEFT" -lt 8 ] && break
            python3 tools/lead_crawl.py --leads coord/results/ranked/contract_buyers_without_mailbox.csv,data/incoming/claude/claude_buyer_leads_cc.csv,data/incoming/claude/claude_buyer_leads.csv --shard ${{ matrix.k }}/$SHARDS --minutes "$LEFT" --workers 200 --max-pages 25 --registry "$REGISTRY" --registry2 20000 && break
            echo "::warning::the site reader stopped before its time (the thread stacks are above): started again for the $LEFT minutes that were left"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "mc-${{ matrix.k }}", path: out/, retention-days: 3, if-no-files-found: ignore }

  merge:
    needs: [plan, crawl]
    if: ${{ always() && needs.crawl.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "mc-*", path: shards, merge-multiple: true }
      - name: Append the mailbox rows, commit, and call the referee
        env: { GH_TOKEN: "${{ github.token }}", STAMP: "${{ needs.plan.outputs.stamp }}" }
        run: |
          ls -la shards | head -40 || true
          git config user.name "mailbox-crawl"; git config user.email "mailbox-crawl@users.noreply.github.com"
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -q -fd data/incoming/claude/crawl_state data/incoming/claude/tenant_state data/incoming/claude/site_facts
            python3 tools/lead_crawl.py --merge shards --stamp "$STAMP" --facts-shards | tee /tmp/crawl.txt
            if ls stores/tenant_done_*.tsv > /dev/null 2>&1; then   # the stores read alongside: accepted leads + their mailbox rows + done lines (tenant_state/)
              python3 tools/cc_tenants.py merge-accepted stores --stamp "$STAMP" | tee /tmp/stores.txt
              python3 tools/lead_crawl.py --merge stores --tenants --stamp "$STAMP" --facts-shards | tee -a /tmp/stores.txt
              git add data/incoming/claude/tenant_state 2>/dev/null || true
            fi
            python3 tools/secret_guard.py | tee -a /tmp/crawl.txt || true   # no pre-signed storage address, no key-shaped token in what is committed (2026-11-10: GitHub refused a whole merge for one)
            git add data/incoming/claude/crawl_state 2>/dev/null || true
            git add data/incoming/claude/site_facts 2>/dev/null || true   # the sites' own name / address / licence number: append-only shards since 2026-11-10
            git add data/incoming/claude/claude_buyer_ap_results_cccrawl*.csv 2>/dev/null || true   # the results file rotates at 30 MB (cccrawl01, 02 …)
            git diff --cached --quiet && { echo "nothing new"; pushed=1; nothing=1; break; }
            git commit -q -m "[claude] mailbox-crawl: role mailboxes of lead buyers ($(grep -m1 '^lead sites read so far' /tmp/crawl.txt | cut -c1-110))"
            git push -q origin HEAD:main && { pushed=1; break; }
            sleep $((RANDOM % 12 + 3))
          done
          # 2026-11-10: twelve refused pushes ended this job green and a run's work was not saved. A merge that could not be pushed is a failed job.
          [ "${pushed:-0}" = "1" ] || { echo "::error::the crawl's rows could not be pushed to main (see the push errors above): nothing of this run was saved"; exit 1; }
          cat /tmp/crawl.txt /tmp/stores.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # pushes made with the workflow token do not start other workflows: call the referee, which re-fetches every evidence page
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/verify-and-merge.yml/dispatches" -f ref=main || true
          # back to back: the next run is queued here (GitHub's own timer fired four times in 36 hours for this workflow, and the keeper only looks
          # after a referee run). One run at a time is the concurrency group's job: this one waits until the present run has ended.
          # (not after a run that read nothing new: an empty queue must not turn into a chain of empty runs — the hourly timer and the keeper start the next)
          [ "${nothing:-0}" = "1" ] || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/mailbox-crawl.yml/dispatches" -f ref=main || true
