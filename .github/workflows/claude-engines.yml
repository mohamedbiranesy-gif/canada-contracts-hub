name: claude-engines
# The claude lane's site engines on parallel runners (owner 2026-11-08 12:08 EST: "if levers are not moving, change them").
# Each shard takes a disjoint set of buyers (hash of the site's host), so no host is ever read by two runners; every
# runner keeps ap_crawler's politeness (robots.txt, 1 request / second / host, identified UA). Outputs are unioned by key
# (tools/merge_engine_outputs.py) and committed to data/incoming/claude/, where rank.py reads them.
#   walk_terms : tools/ap_walk.py (AP / supplier / purchasing pages and PDFs of every delivered buyer site) → tools/ap_terms.py
#                (payment terms, PO rule, portal, AP phone, invoice address, AP contact, format, GST number)
#   registry   : tools/registry_lookup.py --kind buyer (Canada's Business Registries: legal name, BN, registered office)
#                — two runners, one request a second each: the registry sees at most 2 requests / second in total. On a schedule since
#                2026-11-11: it had last run on 2026-11-09 (by hand), and 57,170 buyers whose name carries a legal form, or whose own site
#                states their legal person, were waiting — 8,872 looked up of 66,042.
on:
  schedule:
    - cron: "41 9 * * *"    # daily bulk-registry match (REQ + Corporations Canada open data)
    - cron: "11 */6 * * *"  # org_facts: legal name / address / phone / portals from buyer and vendor sites not read yet (8 shards, 2 h) — cloud-only since 2026-11-09 (owner's Mac is off)
    - cron: "31 2 * * *"    # walk_terms over the stronger packages (AP pages → payment terms, PO rule, invoice address), 6 shards, 4 h
    - cron: "23 1,7,13,19 * * *"  # registry: Canada's Business Registries, the buyers not looked up yet (2 runners, 1 request a second each, 5 h 20)
  workflow_dispatch:
    inputs:
      engine:
        description: "walk_terms | terms_refresh (re-read every known AP page with the current extraction patterns) | org_facts (home / contact / legal pages of buyers and vendors not read yet) | registry | bulk_registry"
        default: walk_terms
      shards:
        description: "number of parallel shards (walk_terms; 1-16)"
        default: "10"
      minutes:
        description: "time box per shard in minutes (max 330)"
        default: "300"
      tiers:
        description: "walk_terms: tiers to walk (I = the P13 long tail; A,B,T,M,L,C,D,E,F = the stronger packages)"
        default: "I"
      max_pages:
        description: "walk_terms: pages per site"
        default: "15"
      redo_days:
        description: "walk_terms: re-walk sites walked within this many days (0 = everything again, e.g. a deeper pass)"
        default: "60"
      only_missing:
        description: "walk_terms: only buyers still lacking a published payment term or PO rule (true/false)"
        default: "false"
      refresh:
        description: "org_facts: true = re-read every site whose record was made by an older version of tools/org_extras.py (its time box goes to that reader)"
        default: "false"
permissions:
  contents: write
  actions: write
env:
  ENGINE: ${{ inputs.engine || (github.event.schedule == '11 */6 * * *' && 'org_facts') || (github.event.schedule == '31 2 * * *' && 'walk_terms') || (github.event.schedule == '23 1,7,13,19 * * *' && 'registry') || 'bulk_registry' }}
  # 2026-11-11: org_facts on schedule 8 -> 4 runners: the account runs 20 jobs at a time, and on 2026-11-11 06:00-08:00Z two org_facts runs
  # held 16 of them while the merges of three other engines and the rank build waited. A runner now carries three readers (see the shard
  # step): the reader of facts costs 250 ms of CPU a site — unlike the mailbox reader (23 ms a page) it does not spend its time waiting,
  # so more sites at a time bought nothing (100 at a time, tried for two hours, is back to 40 per reader).
  # 2026-11-11 11:20Z: 4 -> 3 (site facts) and 6 -> 3 (walk_terms). The account runs 20 jobs at a time and nothing ranks them: a rank build waited
  # 70 minutes behind 20 long-running engine jobs, so the published table was three hours old. The long engines together stay under 16.
  SHARDS: ${{ inputs.shards || (github.event.schedule == '11 */6 * * *' && '3') || (github.event.schedule == '31 2 * * *' && '3') || '1' }}
  MINUTES: ${{ inputs.minutes || (github.event.schedule == '11 */6 * * *' && '120') || (github.event.schedule == '31 2 * * *' && '240') || (github.event.schedule == '23 1,7,13,19 * * *' && '320') || '300' }}
  TIERS: ${{ inputs.tiers || (github.event.schedule == '31 2 * * *' && 'A,B,T,M,L,C,D,E,F') || 'I' }}
  MAXP: ${{ inputs.max_pages || '15' }}
  REDO: ${{ inputs.redo_days || '60' }}
  ONLYMISS: ${{ inputs.only_missing || 'false' }}
  REFRESH: ${{ inputs.refresh || 'false' }}
concurrency:
  group: claude-engines-${{ inputs.engine || github.event.schedule || 'bulk_registry' }}-${{ inputs.tiers || 'all' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          n="$SHARDS"; if [ "$ENGINE" = "bulk_registry" ]; then n=1; fi; if [ "$ENGINE" = "registry" ]; then n=2; fi   # registry: always two runners, one request a second each
          python3 -c "import json; print('matrix=' + json.dumps(list(range($n))))" >> "$GITHUB_OUTPUT"
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        k: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 2026-11-11: a run waits up to an hour for a runner; without this its jobs ran the code of the minute it was dispatched (a whole refresh pass read 148,000 sites with the reader of before its correction)
      - name: Tools
        run: |
          sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
          pip install -q pypdf
          mkdir -p ~/cch-crawler-state
      - name: Resume state from the harvest-state release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 tools/ranked_io.py assemble || true   # the ranked table: a release asset since 2026-11-10 (parts in git before); this fetches / assembles it
          # the engines' big rewritten files are release assets too (tools/state_io.py, coord/STATE_ASSETS.json): fetch the current versions
          python3 tools/state_io.py ensure data/incoming/claude/claude_org_extras.jsonl.gz data/incoming/claude/claude_org_contacts.jsonl.gz data/incoming/claude/claude_ap_terms_pages.csv.gz || true
          gh release download harvest-state -p 'claude_ap_walk_done.tsv' -D /tmp/prevrel 2>/dev/null || true
          python3 tools/merge_engine_outputs.py tsv_done ~/cch-crawler-state/ap_walk_done.tsv /tmp/prevrel/claude_ap_walk_done.tsv data/incoming/claude/claude_ap_walk_done.tsv data/incoming/claude/claude_ap_walk_done_mac.tsv 2>/dev/null || true
          gh release download harvest-state -p 'claude_registry_lookup.jsonl.gz' -D ~/cch-crawler-state 2>/dev/null && gunzip -f ~/cch-crawler-state/claude_registry_lookup.jsonl.gz && mv ~/cch-crawler-state/claude_registry_lookup.jsonl ~/cch-crawler-state/registry_lookup.jsonl || true
          wc -l ~/cch-crawler-state/* 2>/dev/null || true
      - name: walk_terms shard
        if: env.ENGINE == 'walk_terms'
        run: |
          N="$SHARDS"; K=${{ matrix.k }}
          M="$MINUTES"; W=$(( M > 60 ? M - 45 : M / 2 ))
          timeout "${W}m" python3 tools/ap_walk.py --ranked coord/results/ranked/ranked_buyers.csv.gz --tiers "$TIERS" --shard "$K/$N" --workers 40 --max-pages "$MAXP" --redo-days "$REDO" $([ "$ONLYMISS" = "true" ] && echo --only-missing) 2>&1 | tee walk.log | grep -E "sites to walk|\{" | tail -3 || true
          mkdir -p out && grep -oE "sites to walk: [0-9]+" walk.log | grep -oE "[0-9]+" | head -1 > out/sites_left_$K.txt || echo 0 > out/sites_left_$K.txt
          # pages found by hand research (pilot dossiers, layer 2) feed the same extractor: data/incoming/claude/claude_ap_pages_manual.csv (same columns); shard 0 reads them
          if [ "$K" = "0" ] && [ -s data/incoming/claude/claude_ap_pages_manual.csv ]; then tail -n +2 data/incoming/claude/claude_ap_pages_manual.csv >> ~/cch-crawler-state/ap_pages_seen.csv; fi
          if [ -s ~/cch-crawler-state/ap_pages_seen.csv ]; then
            timeout 40m python3 tools/ap_terms.py --urls ~/cch-crawler-state/ap_pages_seen.csv --ranked coord/results/ranked/ranked_buyers.csv.gz --repo "$PWD" --workers 24 || true
          fi
          cp data/incoming/claude/claude_ap_terms.csv out/ap_terms_$K.csv 2>/dev/null || true
          cp data/incoming/claude/claude_ap_terms_pages.csv.gz out/ap_terms_pages_$K.csv.gz 2>/dev/null || true
          cp ~/cch-crawler-state/ap_pages_seen.csv out/pages_$K.csv 2>/dev/null || true
          cp ~/cch-crawler-state/ap_walk_done.tsv out/done_$K.tsv 2>/dev/null || true
          { echo "shard $K/$N: pages $(wc -l < out/pages_$K.csv 2>/dev/null || echo 0), terms rows $(wc -l < out/ap_terms_$K.csv 2>/dev/null || echo 0)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: terms_refresh shard (re-read the pages already read, new extraction patterns; a page that no longer answers keeps its old row)
        if: env.ENGINE == 'terms_refresh'
        run: |
          N="$SHARDS"; K=${{ matrix.k }}
          M="$MINUTES"; W=$(( M > 20 ? M - 10 : M ))
          timeout "${W}m" python3 tools/ap_terms.py --reread-known --shard "$K/$N" --repo "$PWD" --workers 40 2>&1 | tee terms.log | grep -E "pages to read|wrote|filled" | tail -3 || true
          mkdir -p out
          cp data/incoming/claude/claude_ap_terms.csv out/ap_terms_$K.csv 2>/dev/null || true
          cp data/incoming/claude/claude_ap_terms_pages.csv.gz out/ap_terms_pages_$K.csv.gz 2>/dev/null || true
          { echo "shard $K/$N: $(grep -E 'pages to read' terms.log | head -1); $(grep -E '^filled' terms.log | tail -1 | cut -c1-400)"; } >> "$GITHUB_STEP_SUMMARY"
      - name: org_facts shard (legal name, address, phone, logo, BN, portals from the organisation's own home / contact / legal pages; domains not read yet)
        if: env.ENGINE == 'org_facts'
        run: |
          N="$SHARDS"; K=${{ matrix.k }}
          M="$MINUTES"; W=$(( (M - 15) / 2 )); [ "$W" -lt 5 ] && W=5
          WE="$W"; RF="--refresh"   # every run: the sites never read first, then the ones an older version of the reader read (tools/org_extras.py V), as far as the time box goes
          if [ "$REFRESH" = "true" ]; then RF="--refresh --older-only"; WE=$(( M - 35 )); [ "$WE" -lt 10 ] && WE=10; W=15; fi   # a refresh pass: the time goes to the reader of legal names; new sites' contacts get 15 minutes
          python3 tools/site_tasks.py --ranked coord/results/ranked/ranked_buyers.csv.gz --out /tmp/site_tasks.csv --kind both 2>&1 | tail -2 || true
          # 2026-11-11: three readers on each runner, each with a third of the runner's sites and a file of its own. The reader of facts is one busy core
          # (250 ms of CPU a site: 3.4 sites a second however many it reads at a time), a runner has four cores. Each reader stops by itself at
          # the end of its time box and writes its file once more (tools/run_box.py); `timeout` is only the guard behind it. A file holds the
          # records the run made or changed (--delta): the merge joins them with the file on main.
          P=3; mkdir -p out
          for J in $(seq 0 $((P - 1))); do
            timeout -k 3m "$((WE + 12))m" python3 tools/org_extras.py --tasks /tmp/site_tasks.csv --shard "$((K * P + J))/$((N * P))" --seed-resume data/incoming/claude/claude_org_extras.jsonl.gz --workers 40 --minutes "$WE" --delta --out "out/org_extras_${K}_$J.jsonl.gz" --net-gap 1.5 --tried data/incoming/claude/crawl_state --tried-out "out/org_tried_e_${K}_$J.tsv" --repo "$PWD" $RF > "extras_$J.log" 2>&1 &
          done
          wait
          for J in $(seq 0 $((P - 1))); do
            timeout -k 3m "$((W + 12))m" python3 tools/org_contacts.py --tasks /tmp/site_tasks.csv --shard "$((K * P + J))/$((N * P))" --seed-resume data/incoming/claude/claude_org_contacts.jsonl.gz --workers 40 --minutes "$W" --delta --out "out/org_contacts_${K}_$J.jsonl.gz" --net-gap 1.5 --tried data/incoming/claude/crawl_state --tried-out "out/org_tried_c_${K}_$J.tsv" --repo "$PWD" > "contacts_$J.log" 2>&1 &
          done
          wait
          rm -f out/*.resume.jsonl
          for f in out/*.jsonl.gz; do [ -e "$f" ] && { gzip -t "$f" 2>/dev/null || echo "::warning::$f does not read to its end (the merge uses the records it holds)"; }; done
          for J in $(seq 0 $((P - 1))); do
            grep -E "^tasks|^finished|^stopped|wrote|not written|Traceback|Error" "extras_$J.log" | tail -5 | cut -c1-400 || true
            grep -E "^tasks|^finished|^stopped|wrote|not written|Traceback|Error" "contacts_$J.log" | tail -4 | cut -c1-400 || true
            # a reader that printed its tasks and not "finished" was cut by the time box: the merge of a refresh pass starts the next run
            if [ "$REFRESH" = "true" ] && grep -q "^tasks" "extras_$J.log" && ! grep -q "^finished" "extras_$J.log"; then grep -m1 "^tasks" "extras_$J.log" >> out/refresh_cut_$K.txt; fi
            { echo "shard $K/$N reader $J: extras $(grep -E '^tasks' extras_$J.log | head -1) → $(grep -E '^finished|^stopped' extras_$J.log | tail -1 | cut -c1-300); contacts $(grep -E '^tasks' contacts_$J.log | head -1) → $(grep -E '^finished|^stopped' contacts_$J.log | tail -1 | cut -c1-300)"; } >> "$GITHUB_STEP_SUMMARY"
          done
          ls -la out
      - name: registry shard
        if: env.ENGINE == 'registry'
        run: |
          K=${{ matrix.k }}
          timeout "${MINUTES}m" python3 tools/registry_lookup.py --ranked coord/results/ranked/ranked_buyers.csv.gz --kind buyer --shard "$K/2" --repo "$PWD" 2>&1 | tee registry.log | grep -E "^to look up|^looked up|wrote" | tail -4 || true
          mkdir -p out && cp data/incoming/claude/claude_registry_lookup.csv "out/registry_$K.csv" 2>/dev/null || true
          cp ~/cch-crawler-state/registry_lookup.jsonl "out/registry_resume_$K.jsonl" 2>/dev/null || true
          echo "registry shard $K/2: $(grep -m1 '^to look up' registry.log); $(wc -l < out/registry_$K.csv 2>/dev/null || echo 0) rows in its file" >> "$GITHUB_STEP_SUMMARY"
      - name: bulk_registry (REQ open data + Corporations Canada open data, offline exact-name match)
        if: env.ENGINE == 'bulk_registry'
        run: |
          UA='canada-contracts-hub-crawler/1.0 (+https://github.com/mohamedbiranesy-gif/canada-contracts-hub)'
          mkdir -p reg && cd reg
          curl -s -m 900 -A "$UA" -o JeuDonnees.zip "https://www.registreentreprises.gouv.qc.ca/RQAnonymeGR/GR/GR03/GR03A2_22A_PIU_RecupDonnPub_PC/FichierDonneesOuvertes.aspx"
          for f in corporations-active-cbca-en.csv corporations-active-non-cbca-en.csv corporations-inactive-or-dissolved-cbca-en.csv corporations-inactive-or-dissolved-non-cbca-en.csv; do curl -s -m 600 -A "$UA" -o $f "https://d4bf66bykfyaf.cloudfront.net/$f"; done
          ls -la; cd ..
          python3 tools/bulk_registry_match.py --ranked coord/results/ranked/ranked_buyers.csv.gz --req reg/JeuDonnees.zip --cc "reg/corporations-*.csv" --repo "$PWD" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p out && cp data/incoming/claude/claude_registry_bulk.csv out/registry_bulk.csv
          # 2026-11-10: the CRA list of registered charities, matched to the table as it is today (by name and by web address) and written in a compact
          # form for the join by registration number in rank.py. Until this day the match was a file made on the owner's Mac on 2026-11-08, for a
          # table of 65,000 rows.
          python3 tools/charity_buyers.py --repo "$PWD" 2>&1 | tail -4 | tee -a "$GITHUB_STEP_SUMMARY" || true
          cp data/incoming/claude/claude_charity_buyers.csv out/charity_buyers.csv 2>/dev/null || true
          cp data/incoming/claude/claude_cra_charities.csv.gz out/cra_charities.csv.gz 2>/dev/null || true
          # 2026-11-11: the federal grants & contributions disclosure (2.4 GB, 1.4 M agreements): the recipient's Business Number and legal name for the
          # organisations of today's table — also a Mac file of 2026-11-08 until now (3,668 organisations; 8,400 on the table of 2026-11-10)
          timeout 60m python3 tools/gc_recipients.py --repo "$PWD" --workdir /tmp/gc 2>&1 | grep -E "^rows:|^matches:|^wrote" | cut -c1-900 | tee -a "$GITHUB_STEP_SUMMARY" || true
          rm -rf /tmp/gc
          cp data/incoming/claude/claude_gc_recipients.csv out/gc_recipients.csv 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ env.ENGINE }}-${{ matrix.k }}
          path: out/
          if-no-files-found: ignore
          retention-days: 3
  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-${{ env.ENGINE }}-*
          path: shards
          merge-multiple: true
      - name: Union with the files on main and commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la shards || true
          git config user.name "claude-engines"; git config user.email "claude-engines@users.noreply.github.com"
          TRIED_STAMP=$(date -u +%Y%m%dT%H%M%S)
          for i in $(seq 1 15); do   # main moves every minute or two (verifier, lanes, the Mac): 15 attempts, short random waits (the registry merge lost 5 races on 2026-11-08)
            git fetch -q origin main && git reset -q --hard origin/main   # clean start each attempt: the merge below is redone from the shard files
            # 2026-11-10: three files that are rewritten whole on every merge (already compressed, so git kept every version whole: 0.5 GB of objects a
            # day) are assets of the state release; the merge starts from the current asset and uploads the result (tools/state_io.py)
            BIG="data/incoming/claude/claude_org_extras.jsonl.gz data/incoming/claude/claude_org_contacts.jsonl.gz data/incoming/claude/claude_ap_terms_pages.csv.gz"
            python3 tools/state_io.py ensure $BIG || true
            if [ "$ENGINE" = "terms_refresh" ]; then
              python3 tools/merge_engine_outputs.py ap_terms data/incoming/claude/claude_ap_terms.csv data/incoming/claude/claude_ap_terms.csv data/incoming/claude/claude_ap_terms_pages.csv.gz shards/ap_terms_*.csv shards/ap_terms_pages_*.csv.gz
            elif [ "$ENGINE" = "walk_terms" ]; then
              python3 tools/merge_engine_outputs.py ap_terms data/incoming/claude/claude_ap_terms.csv data/incoming/claude/claude_ap_terms.csv data/incoming/claude/claude_ap_terms_pages.csv.gz shards/ap_terms_*.csv shards/ap_terms_pages_*.csv.gz
              [ -f data/incoming/claude/claude_ap_pages_seen.csv.gz ] && gunzip -c data/incoming/claude/claude_ap_pages_seen.csv.gz > /tmp/pages_main.csv || : > /tmp/pages_main.csv
              python3 tools/merge_engine_outputs.py pages /tmp/pages.csv /tmp/pages_main.csv shards/pages_*.csv && gzip -c /tmp/pages.csv > data/incoming/claude/claude_ap_pages_seen.csv.gz
              python3 tools/merge_engine_outputs.py tsv_done /tmp/done.tsv shards/done_*.tsv
              gh release download harvest-state -p 'claude_ap_walk_done.tsv' -D /tmp/prev 2>/dev/null && python3 tools/merge_engine_outputs.py tsv_done /tmp/done2.tsv /tmp/prev/claude_ap_walk_done.tsv /tmp/done.tsv && mv /tmp/done2.tsv /tmp/done.tsv || true
              python3 tools/merge_engine_outputs.py tsv_done /tmp/done3.tsv /tmp/done.tsv data/incoming/claude/claude_ap_walk_done.tsv data/incoming/claude/claude_ap_walk_done_mac.tsv 2>/dev/null && cp /tmp/done3.tsv data/incoming/claude/claude_ap_walk_done.tsv
              cp data/incoming/claude/claude_ap_walk_done.tsv /tmp/claude_ap_walk_done.tsv && gh release upload harvest-state /tmp/claude_ap_walk_done.tsv --clobber || true
            elif [ "$ENGINE" = "org_facts" ]; then
              python3 tools/merge_engine_outputs.py jsonl data/incoming/claude/claude_org_extras.jsonl.gz data/incoming/claude/claude_org_extras.jsonl.gz shards/org_extras_*.jsonl.gz
              python3 tools/merge_engine_outputs.py jsonl data/incoming/claude/claude_org_contacts.jsonl.gz data/incoming/claude/claude_org_contacts.jsonl.gz shards/org_contacts_*.jsonl.gz
              # the sites the readers could not read this run (tools/run_box.py Tried): one shard a run, append-only; the readers wait before they ask again
              if ls shards/org_tried_*.tsv >/dev/null 2>&1; then mkdir -p data/incoming/claude/crawl_state && cat shards/org_tried_*.tsv | sort -u | gzip -9 > "data/incoming/claude/crawl_state/org_tried_${TRIED_STAMP}.gz"; fi
            elif [ "$ENGINE" = "bulk_registry" ]; then
              [ -f shards/registry_bulk.csv ] && cp shards/registry_bulk.csv data/incoming/claude/claude_registry_bulk.csv
              [ -s shards/charity_buyers.csv ] && cp shards/charity_buyers.csv data/incoming/claude/claude_charity_buyers.csv
              [ -s shards/cra_charities.csv.gz ] && cp shards/cra_charities.csv.gz data/incoming/claude/claude_cra_charities.csv.gz
              [ -s shards/gc_recipients.csv ] && [ "$(wc -l < shards/gc_recipients.csv)" -gt 2000 ] && cp shards/gc_recipients.csv data/incoming/claude/claude_gc_recipients.csv   # a run that could not read the disclosure writes a short file: the one on main stays
            else
              python3 tools/merge_engine_outputs.py registry data/incoming/claude/claude_registry_lookup.csv data/incoming/claude/claude_registry_lookup.csv shards/registry_*.csv
              # the answers on file (every lookup with the registry's own document): each runner's file holds the state it started from plus its own
              # lookups; the union keeps the last answer per organisation
              if ls shards/registry_resume_*.jsonl >/dev/null 2>&1; then
                python3 tools/merge_engine_outputs.py registry_answers /tmp/claude_registry_lookup.jsonl.gz shards/registry_resume_*.jsonl && gh release upload harvest-state /tmp/claude_registry_lookup.jsonl.gz --clobber || true
              fi
            fi
            git add data/incoming/claude/
            PUB=""
            case "$ENGINE" in
              org_facts) PUB="data/incoming/claude/claude_org_extras.jsonl.gz data/incoming/claude/claude_org_contacts.jsonl.gz" ;;
              walk_terms|terms_refresh) PUB="data/incoming/claude/claude_ap_terms_pages.csv.gz" ;;
            esac
            if [ -n "$PUB" ] && python3 tools/state_io.py publish $PUB; then   # uploaded: the manifest line is committed, the files themselves leave the index
              git add coord/STATE_ASSETS.json
              git rm -q --cached --ignore-unmatch $PUB
            fi
            git diff --cached --quiet && { echo "nothing new"; exit 0; }
            git commit -q -m "claude-engines: $ENGINE merged ($SHARDS runner(s), $MINUTES min) [skip ci]" || true
            git push -q origin HEAD:main && break
            echo "push attempt $i failed (main moved); redoing the merge on the new head"
            sleep $((RANDOM % 12 + 3))
          done
          if [ "$ENGINE" = "org_facts" ] && [ "$REFRESH" = "true" ]; then
            # a refresh pass that its time box cut short goes on in a next run (a shard whose reader did not print its last line was cut)
            cut=$(ls shards/refresh_cut_*.txt 2>/dev/null | wc -l)
            echo "refresh: shards cut by their time box: $cut of $SHARDS" >> "$GITHUB_STEP_SUMMARY"
            if [ "$cut" -gt 0 ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/claude-engines.yml/dispatches" -f ref=main -f "inputs[engine]=org_facts" -f "inputs[shards]=4" -f "inputs[minutes]=$MINUTES" -f "inputs[refresh]=true" && echo "next refresh run dispatched" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi
          if [ "$ENGINE" = "walk_terms" ]; then
            left=$(cat shards/sites_left_*.txt 2>/dev/null | awk '{s+=$1} END {print s+0}')
            walked=$(wc -l < /tmp/done.tsv 2>/dev/null || echo 0)
            echo "sites still to walk (sum over shards at start): $left; walked so far: $walked" >> "$GITHUB_STEP_SUMMARY"
            if [ "$left" -gt "$((SHARDS * 50))" ] && [ "$REDO" != "0" ]; then  # a redo-everything pass (deep walk) must not re-dispatch itself: its "sites to walk" never shrinks
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/claude-engines.yml/dispatches" -f ref=main -f "inputs[engine]=walk_terms" -f "inputs[shards]=$SHARDS" -f "inputs[minutes]=$MINUTES" -f "inputs[tiers]=$TIERS" -f "inputs[max_pages]=$MAXP" -f "inputs[redo_days]=$REDO" -f "inputs[only_missing]=$ONLYMISS" && echo "re-dispatched walk_terms" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, io, os
          csv.field_size_limit(1 << 30)
          p = {"walk_terms": "data/incoming/claude/claude_ap_terms.csv", "terms_refresh": "data/incoming/claude/claude_ap_terms.csv", "org_facts": "", "registry": "data/incoming/claude/claude_registry_lookup.csv", "bulk_registry": "data/incoming/claude/claude_registry_bulk.csv"}[os.environ["ENGINE"]]
          rows = list(csv.DictReader(io.StringIO(open(p, encoding="utf-8", errors="replace").read().replace("\0", "")))) if p and os.path.exists(p) else []
          print("merged file:", p, len(rows), "rows")
          if rows and "payment_terms" in rows[0]:
              print({c: sum(1 for r in rows if r.get(c)) for c in ("payment_terms", "po_required", "portal_name", "ap_phone", "invoice_mailing_address", "ap_contact_name", "invoice_format", "buyer_bn", "payment_method", "ap_cycle", "tax_exempt", "esignature", "ap_system")})
          if rows and "status" in rows[0] and "bn9" in rows[0]:
              import collections; print(collections.Counter(r["status"] for r in rows))
          EOF
