name: jules-builder
# Starts a Jules session (Gemini coding agent, runs in Google's cloud). Jules opens a PR; the referee checks it.
on:
  # schedule:   # stopped 2026-11-13 by the owner: coord/ACTIONS_PAUSED
    # - cron: "43 2 * * *"
    # - cron: "43 14 * * *"
  workflow_dispatch:
    inputs:
      extra:
        description: "Optional extra instruction for Jules"
        default: ""
permissions:
  contents: read
jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Key present?
        id: key
        env: { K: "${{ secrets.JULES_API_KEY }}" }
        run: echo "ok=$([ -n "$K" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Report recent Jules sessions and approve plans that wait for approval
        if: steps.key.outputs.ok == 'yes'
        env: { K: "${{ secrets.JULES_API_KEY }}" }
        run: |
          curl -s -H "X-Goog-Api-Key: $K" "https://jules.googleapis.com/v1alpha/sessions?pageSize=15" > sessions.json || true
          python3 - <<'PY'
          import json, os, subprocess
          d = json.load(open("sessions.json")) if os.path.getsize("sessions.json") else {}
          if "error" in d: print("API error:", d["error"])
          for s in d.get("sessions", []):
              outs = [o.get("pullRequest", {}).get("url") for o in s.get("outputs", []) if o.get("pullRequest")]
              print(s.get("createTime"), s.get("state"), s.get("title", "")[:70], outs or "", s.get("url"))
              if s.get("state") == "AWAITING_USER_FEEDBACK":
                  a = subprocess.run(["curl", "-s", "-H", "X-Goog-Api-Key: " + os.environ["K"],
                                      "https://jules.googleapis.com/v1alpha/%s/activities?pageSize=30" % s["name"]], capture_output=True, text=True).stdout
                  try:
                      msgs = [x["agentMessaged"].get("agentMessage", "") for x in json.loads(a).get("activities", []) if "agentMessaged" in x]
                      print("  Jules asked:", (msgs[-1] if msgs else "?")[:400].replace("\n", " "))
                  except Exception:
                      pass
                  r = subprocess.run(["curl", "-s", "-X", "POST", "-H", "X-Goog-Api-Key: " + os.environ["K"], "-H", "Content-Type: application/json",
                                      "-d", json.dumps({"prompt": "Nobody is available to answer questions; this is an unattended run. Use your best judgment under AGENTS.md (prefer the option that adds the most NEW distinct buyers with a Canada-located vendor, keep every source field, respect robots/rate limits), finish the work, and open the pull request now. Do not ask again."}),
                                      "https://jules.googleapis.com/v1alpha/%s:sendMessage" % s["name"]], capture_output=True, text=True)
                  print("  told it to proceed:", r.stdout[:120] or "ok")
              if s.get("state") == "AWAITING_PLAN_APPROVAL":
                  r = subprocess.run(["curl", "-s", "-X", "POST", "-H", "X-Goog-Api-Key: " + os.environ["K"], "-H", "Content-Type: application/json",
                                      "-d", "{}", "https://jules.googleapis.com/v1alpha/%s:approvePlan" % s["name"]], capture_output=True, text=True)
                  print("  approved plan:", r.stdout[:200])
          PY
      - name: Invoke Jules
        if: steps.key.outputs.ok == 'yes'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: main
          # empty strings on purpose: the action tests these inputs as strings, so "false" still includes the 20-commit
          # log, which grew past the shell's argument limit ("jq: Argument list too long") and broke every run
          include_commit_log: ''
          include_last_commit: ''
          prompt: |
            You are Jules, lane `jules` of a three-AI team. Read AGENTS.md (binding) and follow prompts/jules_builder.md.
            Open one PR with your results. Nobody answers questions during this run: never ask, decide yourself under AGENTS.md
            and open the PR. If the source is too big for one run, open a PR with a working first slice. ${{ inputs.extra }}
