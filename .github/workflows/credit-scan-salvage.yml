name: credit-scan-salvage
# A scan cycle whose merge could not be pushed (credit-scan.yml before 2026-11-13: the merge was recomputed before each push and main had
# always moved on) leaves its scan shards as artifacts for three days. This merges the shards of the run given, once, with the same command
# as credit-scan.yml's merge_scan, and pushes with a merge of main on a refused push. Nothing else is read or fetched.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "the credit-scan run whose cs-scan-* artifacts to merge"
        required: true
      pattern:
        description: "artifact name pattern (cs-scan-* for the home-page scan, cs-vendors-* for the vendor proofs)"
        default: "cs-scan-*"
permissions:
  contents: write
  actions: read
concurrency:
  group: credit-scan-salvage
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.pattern }}
          path: shards
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Merge once, then push (merging main into the commit when a push is refused)
        env: { RUN_ID: "${{ inputs.run_id }}", PATTERN: "${{ inputs.pattern }}" }
        run: |
          ls -la shards | head -40 || true
          [ -n "$(ls shards 2>/dev/null)" ] || { echo "::error::no artifacts of run $RUN_ID matched $PATTERN (expired?)"; exit 1; }
          SFX=$([ "$PATTERN" = "cs-vendors-*" ] && echo v || echo s)
          STAMP="$(date -u +%Y%m%dT%H%M%S)r${RUN_ID}${SFX}"
          git config user.name "credit-scan"; git config user.email "credit-scan@users.noreply.github.com"
          python3 tools/credit_scan.py merge shards --stamp "$STAMP" --lead-shards | tee /tmp/m.txt
          python3 tools/secret_guard.py || true
          git add data/incoming/claude/credit_scan data/incoming/claude/lead_shards 2>/dev/null || true
          for f in claude_buyer_leads_cc.csv claude_lead_details_cc.jsonl.gz claude_tenant_candidates.csv.gz; do [ -e "data/incoming/claude/$f" ] && git add "data/incoming/claude/$f"; done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "credit-scan (salvaged run $RUN_ID): $(grep -m1 '^credit scan:' /tmp/m.txt | cut -c14-120) [skip ci]"
          for i in $(seq 1 25); do
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 8 + 2))
            git fetch -q origin main
            git merge -q --no-edit -X theirs origin/main || { git merge --abort 2>/dev/null; true; }
          done
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::the salvaged merge could not be pushed"; exit 1; }
          cat /tmp/m.txt >> "$GITHUB_STEP_SUMMARY"
