name: tm-sites
# The own sites of trademark owners in Canada that no site on file is tied to (tools/tm_register.py sites). The register gives a legal name
# and an address; an organisation's site is usually under a domain name that is its own name written out. A few such names are resolved (.ca
# and .com); the home page of those that answer is read (robots.txt obeyed; its contact page too when the home page prints no postal code)
# and the site is kept ONLY when its own pages tie it to the owner: the same name and the same postal code, the owner's legal person stated
# with its legal form, or the owner's name as both the domain name and the site's own name on a site in Canada. Measured on 300 owners:
# 85 % have a name that resolves, 11 % end tied. Then the daily match and the leads (tm-register.yml).
# abroad=true (2026-11-10): the owners outside Canada — a foreign company that pays a Canadian agent of record to hold its marks here. Same
# tests with the owner's own country in the place of Canada: the same name and the register's ZIP code / postcode printed in an address on
# the site; or the legal person stated with its legal form, or the name as the domain name, on a site that prints an address of the
# owner's state. Measured on 117 owners: 8 tied (Concept2, DuBois Chemicals, Tracksmith …).
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "parallel runners (1-6)"
        default: "4"
      minutes:
        description: "minutes per runner"
        default: "120"
      limit:
        description: "at most this many owners per runner (0 = no limit)"
        default: "0"
      abroad:
        description: "true = the owners outside Canada (United States, United Kingdom, Australia, and since 2026-11-12 ten European countries): 109,538 owners abroad have a Canadian agent of record"
        default: "false"
      force:
        description: "true = make the Overture candidate lists again even when Overture has published no newer release (2026-11-13: the European legal forms written out are left out of the names now)"
        default: "false"
      overture:
        description: "true (with abroad=true) = only the owners abroad for whom an Overture Maps place lists a website under their name (postal code / state) or at their own address (street number and ZIP code; UK postcode): that published site is read first (the candidate lists are made first, once per Overture release)"
        default: "false"
      legal:
        description: "true (with abroad=true and overture=true) = read again the listed sites of owners read before, with the legal-page test (the site's own terms / privacy / legal notice printing the owner's full legal name with its legal form)"
        default: "false"
      ror:
        description: "true = only the owners for whom the Research Organization Registry lists a website under their name in their country (tm_ror_sites.csv, tools/ror_sites.py); with abroad=true the owners abroad, else the owners in Canada"
        default: "false"
      clearbit:
        description: "true (with abroad=true) = also the domains the company-name autocomplete gives under the owner's very name, one request a second per runner (owners looked for before included); a domain is kept by the same tests (the register's postal code printed under the same name, or the legal person with its legal form in the owner's state)"
        default: "false"
permissions:
  contents: write
  actions: write
concurrency:
  group: tm-sites
  cancel-in-progress: false
env:
  SHARDS: ${{ inputs.shards || '4' }}
  MINUTES: ${{ inputs.minutes || '120' }}
  LIMIT: ${{ inputs.limit || '0' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: python3 -c "import os; n=max(1,min(6,int(os.environ['SHARDS']))); print('matrix=' + str(list(range(n))))" >> "$GITHUB_OUTPUT"

  # 2026-11-12: the websites an Overture Maps place lists under an owner's name (open data; published, not guessed): written once, committed,
  # then every runner reads them first. 2026-11-13: also the websites listed by the places AT the owner's own address (street number, street and
  # ZIP code; a UK postcode) under any name (tools/overture_names.py addr); a site still counts only when its own pages state the owner's name
  candidates:
    needs: plan
    if: ${{ inputs.overture == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Owners abroad x the Overture Maps places that list a website (under the owner's name; at the owner's own address)
        run: |
          pip install -q duckdb
          # each list is made again only when Overture has published a newer release than the one it was made from (its last column)
          newest=$(curl -sS --retry 3 "https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" | grep -o 'release/[0-9-]*\.[0-9]*/' | sort | tail -1 | cut -d/ -f2)
          made() { [ "${{ inputs.force }}" = "true" ] && { echo forced; return; }; tail -1 "$1" 2>/dev/null | awk -F, '{print $NF}' | tr -d '\r'; }
          echo "newest Overture release: $newest" | tee /tmp/ovt.txt
          D=data/incoming/claude/tm
          [ "$(made $D/tm_overture_sites.csv)" = "$newest" ] || python3 tools/tm_register.py overture-sites | tee -a /tmp/ovt.txt
          [ "$(made $D/tm_overture_addr_sites.csv)" = "$newest" ] || python3 tools/overture_names.py addr --lanes tm 2>&1 | tee -a /tmp/ovt.txt
          # 2026-11-13: owners in Canada too (the full postal code), read by sites --overture without abroad
          [ "$(made $D/tm_overture_addr_ca_sites.csv)" = "$newest" ] || python3 tools/overture_names.py addr --lanes tmca 2>&1 | tee -a /tmp/ovt.txt
          mkdir -p /tmp/ovt && cp $D/tm_overture_*.csv /tmp/ovt/ 2>/dev/null || true
          git config user.name "tm-sites"; git config user.email "tm-sites@users.noreply.github.com"
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/ovt/*.csv $D/ 2>/dev/null || true
            git add $D/tm_overture_*.csv 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "tm-sites: $(tail -1 /tmp/ovt.txt | cut -c1-130) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::the candidates could not be pushed to main"; exit 1; }
          cat /tmp/ovt.txt >> "$GITHUB_STEP_SUMMARY"

  sites:
    needs: [plan, candidates]
    if: ${{ always() && needs.plan.result == 'success' && needs.candidates.result != 'failure' && needs.candidates.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Look for each owner's own site under its own name
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          python3 tools/tm_register.py sites --shard ${{ matrix.k }}/$SHARDS --minutes $M --workers 40 --limit "$LIMIT" ${{ inputs.abroad == 'true' && '--abroad' || '' }} ${{ inputs.overture == 'true' && '--overture' || '' }} ${{ inputs.legal == 'true' && '--legal' || '' }} ${{ inputs.clearbit == 'true' && '--clearbit' || '' }} ${{ inputs.ror == 'true' && '--ror' || '' }}
      - uses: actions/upload-artifact@v4
        with: { name: "tms-${{ matrix.k }}", path: out/, retention-days: 3 }

  merge:
    needs: [plan, sites]
    if: ${{ always() && needs.sites.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "tms-*", path: shards, merge-multiple: true }
      - name: Sites found -> main; then the match and the leads
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la shards | head -20 || true
          git config user.name "tm-sites"; git config user.email "tm-sites@users.noreply.github.com"
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/tm_register.py merge-sites shards | tee /tmp/tms.txt
            python3 tools/cross_sites.py | tee -a /tmp/cross.txt || true   # 2026-11-13: the other register's site for the same legal person (same name, country, postal code)
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add data/incoming/claude/tm 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "tm-sites: $(tail -1 /tmp/tms.txt | cut -c1-130) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          # a merge that could not be pushed is a failed job
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main: its work was not saved"; exit 1; }
          cat /tmp/tms.txt >> "$GITHUB_STEP_SUMMARY"
          { [ -f "$GITHUB_WORKSPACE/coord/ACTIONS_PAUSED" ] || gh api "repos/${GITHUB_REPOSITORY}/contents/coord/ACTIONS_PAUSED" --silent 2>/dev/null; } && echo "not started (coord/ACTIONS_PAUSED: the project is stopped)" || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/tm-register.yml/dispatches" -f ref=main -f "inputs[stage]=match" || true
