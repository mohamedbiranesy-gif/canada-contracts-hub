name: biz-licences
# Business licences and merchant permits (open data of Canadian cities and regulators) joined to the organisations we already hold
# (tools/biz_licences.py). A licence in force is a dated payment to a Canadian public body: licence number, legal / trade name, address, issue and
# expiry dates, sometimes the fee paid. Only the open-data portals' API / bulk endpoints are asked (a few requests per source); no site is crawled.
#   probe : search each portal's catalogue; print dataset ids, fields, row counts and two sample rows (nothing is written)
#   pull  : download the configured lists -> tie licences to organisations (postal code / telephone / street address + name) -> lead_shards/
on:
  # schedule:   # stopped 2026-11-13 by the owner: coord/ACTIONS_PAUSED
    # - cron: "41 4,16 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "probe | pull"
        default: "pull"
      only:
        description: "sources / portals (comma separated; empty = all configured)"
        default: ""
permissions:
  contents: write
  actions: write
concurrency:
  group: biz-licences
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Probe the catalogues (stage=probe)
        if: ${{ inputs.stage == 'probe' }}
        run: |
          python3 tools/biz_licences.py probe --only "${{ inputs.only || '' }}" 2>&1 | tee /tmp/probe.txt
          { echo '```'; head -c 900000 /tmp/probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Download, match, commit (stage=pull)
        if: ${{ inputs.stage != 'probe' }}
        env: { GH_TOKEN: "${{ github.token }}", ONLY: "${{ inputs.only || '' }}" }
        run: |
          python3 tools/ranked_io.py assemble || true
          python3 tools/biz_licences.py pull --only "$ONLY" 2>&1 | tee /tmp/l.txt
          python3 tools/biz_licences.py match out 2>&1 | tee -a /tmp/l.txt
          # 2026-11-13: licensees no organisation on file matched: the websites an Overture place at the licence's own postal code lists, kept by the
          # lane's own rule read on the site (names agree AND the licence's postal code / telephone / street printed); candidates made again per release
          newest=$(curl -sS --retry 3 "https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" | grep -o 'release/[0-9-]*\.[0-9]*/' | sort | tail -1 | cut -d/ -f2)
          made=$(tail -1 data/incoming/claude/overture/lic_addr_candidates.csv 2>/dev/null | awk -F, '{print $NF}' | tr -d '\r')
          if [ -n "$newest" ] && [ "$made" != "$newest" ]; then pip install -q duckdb && python3 tools/overture_names.py addr --lanes lic --lic-dir out 2>&1 | tail -3 | tee -a /tmp/l.txt || true; fi
          python3 tools/biz_licences.py addr-sites out --minutes 60 --workers 30 2>&1 | tail -3 | tee -a /tmp/l.txt || true
          mkdir -p keep && cp out/licence_leads.jsonl keep/ 2>/dev/null || true
          cp out/licence_leads_addr.jsonl out/lic_addr_done.tsv keep/ 2>/dev/null || true
          mkdir -p keep/ovt && cp data/incoming/claude/overture/lic_addr_candidates.csv keep/ovt/ 2>/dev/null || true
          # what one licence is billed (tools/payee_fees.py): Toronto's nightly list of outstanding licence invoices (licence number, invoice number,
          # amount due), the fee of each kind of Toronto licence, Calgary's and Edmonton's fee schedules. A source that fails keeps its last reading.
          python3 tools/payee_fees.py harvest 2>&1 | tee -a /tmp/l.txt || true
          cp data/incoming/claude/payee_fees.json data/incoming/claude/payee_open_invoices.csv.gz keep/ 2>/dev/null || true
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          git config user.name "biz-licences"; git config user.email "biz-licences@users.noreply.github.com"
          for i in $(seq 1 10); do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -q -fd data/incoming/claude/lead_shards
            mkdir -p data/incoming/claude/overture && cp keep/ovt/lic_addr_candidates.csv data/incoming/claude/overture/ 2>/dev/null || true
            python3 tools/biz_licences.py merge keep --stamp "$STAMP" | tee /tmp/m.txt
            # rosters another lane harvested (members, dealers, tenants, exhibitors, sponsors of a Canadian body: contrib/<lane>/rosters/<key>.json +
            # data/incoming/<lane>/roster_<key>.csv): the same commit carries their leads (tools/roster_ingest.py checks each roster's proof itself)
            python3 tools/roster_ingest.py merge --stamp "$STAMP" 2>&1 | tee -a /tmp/m.txt || true
            cp keep/payee_fees.json keep/payee_open_invoices.csv.gz data/incoming/claude/ 2>/dev/null || true
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add data/incoming/claude/lead_shards data/incoming/claude/payee_fees.json data/incoming/claude/payee_open_invoices.csv.gz 2>/dev/null || true
            git add data/incoming/claude/licences data/incoming/claude/overture/lic_addr_candidates.csv 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "biz-licences: $(tail -1 /tmp/m.txt | cut -c1-150) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          # a merge that could not be pushed is a failed job (2026-11-10: twelve refused pushes ended a crawl's merge green)
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main (see the push errors above): its work was not saved"; exit 1; }
          { echo '```'; cat /tmp/l.txt /tmp/m.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
