name: bc-crown
# The Province of British Columbia's own bills to organisations, from its own open data (tools/bc_crown.py):
#  - water: every organisation holding a current water licence is billed a yearly water rental ("When a water licence is issued, annual water rentals
#    are assessed"; "Our statements are sent to the client(s) we currently have registered on record as the water licence holder"), paid by online
#    banking or cheque; the yearly rental is calculated from the licence's published quantity and purpose with the published rates (B.C. Reg. 37/2016);
#  - stumpage: every client the Harvest Billing System billed in the last 183 days, from its public Billing Summary report (each invoice: number,
#    timber mark, value, billing date) and the harvesting authorities layer (client names); "due upon receipt of your invoice", paid through a bank.
# A holder's site is tied from the sites on file (same postal code, names that agree), the Overture places at its postal code that list a website
# (checked on the site's own pages), or the company-name autocomplete under its very name (checked on the site's home page). The mailbox comes from
# that site (mailbox-crawl reads lead_shards/). Resumable: the done lists are committed; every run asks about the names not asked yet.
# 2026-11-13: also the Alberta Energy Regulator's yearly administration fee (industry levy), invoiced by e-mail every April to the operator of
# record of each well (the licensee when the operator does not pay), payable by cheque or EFT only — the licensees of ST37, List of Wells in Alberta.
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes for the site finder (the autocomplete, one name a second)"
        default: "110"
permissions:
  contents: write
concurrency:
  group: bc-crown
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Pull, build, find sites, write leads, commit
        env: { MINUTES: "${{ inputs.minutes || '110' }}" }
        run: |
          sudo apt-get -qq update >/dev/null 2>&1 || true
          sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1 || true
          python3 tools/bc_crown.py pull-water --work /tmp/bcw 2>&1 | tail -3 | tee /tmp/l.txt
          python3 tools/bc_crown.py build-water --work /tmp/bcw 2>&1 | tee -a /tmp/l.txt
          python3 tools/bc_crown.py pull-stumpage --work /tmp/bcs 2>&1 | grep -v "features from" | tee -a /tmp/l.txt || true
          python3 tools/bc_crown.py build-stumpage --work /tmp/bcs 2>&1 | tee -a /tmp/l.txt || true
          # the Alberta Energy Regulator's yearly administration fee: the licensees of ST37's wells (pulled only when the AER publishes a newer file)
          pip install -q openpyxl
          python3 tools/bc_crown.py pull-aer --work /tmp/aer 2>&1 | tee -a /tmp/l.txt || true
          python3 tools/bc_crown.py build-aer --work /tmp/aer 2>&1 | tee -a /tmp/l.txt || true
          # Health Canada's Pest Management Regulatory Agency: four invoices a year to every registrant of a current pest control product
          python3 tools/bc_crown.py pull-pmra --work /tmp/pmra 2>&1 | tee -a /tmp/l.txt || true
          python3 tools/bc_crown.py build-pmra --work /tmp/pmra 2>&1 | tee -a /tmp/l.txt || true
          # the Canadian Nuclear Safety Commission: a yearly invoice before each licence anniversary to every licensee that pays (its licence database)
          python3 tools/bc_crown.py pull-cnsc --work /tmp/cnsc 2>&1 | tee -a /tmp/l.txt || true
          python3 tools/bc_crown.py build-cnsc --work /tmp/cnsc 2>&1 | tee -a /tmp/l.txt || true
          # the Canada Energy Regulator: every company it regulates pays its share of the CER's costs (quarterly invoices for a large company, a yearly levy for a small one)
          python3 tools/bc_crown.py pull-cer --work /tmp/cer 2>&1 | tee -a /tmp/l.txt || true
          python3 tools/bc_crown.py build-cer --work /tmp/cer 2>&1 | tee -a /tmp/l.txt || true
          # the places at each water licence holder's own postal code that list a website (made again when Overture publishes a newer release)
          newest=$(curl -sS --retry 3 "https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" | grep -o 'release/[0-9-]*\.[0-9]*/' | sort | tail -1 | cut -d/ -f2)
          made=$(tail -1 data/incoming/claude/overture/bcw_addr_candidates.csv 2>/dev/null | awk -F, '{print $NF}' | tr -d '\r')
          if [ -n "$newest" ] && [ "$made" != "$newest" ]; then pip install -q duckdb && python3 tools/overture_names.py addr --lanes bcw 2>&1 | tail -3 | tee -a /tmp/l.txt || true; fi
          # the places under each holder's very name, at its postal code or in its own province (made again when Overture publishes a newer release)
          madeq=$(tail -1 data/incoming/claude/overture/bcg_candidates.csv 2>/dev/null | awk -F, '{print $NF}' | tr -d '\r')
          if [ -n "$newest" ] && [ "$madeq" != "$newest" ]; then pip install -q duckdb && python3 tools/overture_names.py query --lanes bcg 2>&1 | tail -3 | tee -a /tmp/l.txt || true; fi
          python3 tools/bc_crown.py sites --minutes "$MINUTES" --addr-minutes 40 --threads 12 2>&1 | tee -a /tmp/l.txt
          D=data/incoming/claude/bcgov
          mkdir -p keep keep/ovt
          for f in bc_water_licensees.csv.gz bc_stumpage_clients.csv.gz bc_stumpage_invoices.csv.gz ab_aer_licensees.csv.gz ab_aer_info.json hc_pmra_registrants.csv.gz cnsc_licensees.csv.gz cer_companies.csv.gz bc_sites.csv bc_sites_done.tsv bc_addr_done.tsv bc_overture_done.tsv; do cp "$D/$f" keep/ 2>/dev/null || true; done
          cp data/incoming/claude/overture/bcw_addr_candidates.csv data/incoming/claude/overture/bcg_candidates.csv keep/ovt/ 2>/dev/null || true
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          git config user.name "bc-crown"; git config user.email "bc-crown@users.noreply.github.com"
          for i in $(seq 1 10); do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -q -fd data/incoming/claude/lead_shards
            mkdir -p $D data/incoming/claude/overture
            cp keep/ovt/bcw_addr_candidates.csv keep/ovt/bcg_candidates.csv data/incoming/claude/overture/ 2>/dev/null || true
            # the site list and the done lists only grow: the lines of main and of this run, once each
            for f in bc_sites.csv bc_sites_done.tsv bc_addr_done.tsv bc_overture_done.tsv; do
              [ -f "keep/$f" ] || continue
              if [ -f "$D/$f" ]; then
                python3 - "$D/$f" "keep/$f" <<'PY'
          import sys
          a = open(sys.argv[1], encoding="utf-8").read().splitlines()
          b = open(sys.argv[2], encoding="utf-8").read().splitlines()
          seen, out = set(), []
          for l in a + b:
              if l not in seen:
                  seen.add(l); out.append(l)
          head = [l for l in out if l.startswith("key,")][:1]
          open(sys.argv[1], "w", encoding="utf-8").write("\n".join(head + [l for l in out if not l.startswith("key,")]) + "\n")
          PY
              else
                cp "keep/$f" "$D/$f"
              fi
            done
            for f in bc_water_licensees.csv.gz bc_stumpage_clients.csv.gz bc_stumpage_invoices.csv.gz ab_aer_licensees.csv.gz ab_aer_info.json hc_pmra_registrants.csv.gz cnsc_licensees.csv.gz cer_companies.csv.gz; do cp "keep/$f" "$D/" 2>/dev/null || true; done
            python3 tools/bc_crown.py leads --stamp "$STAMP" | tee /tmp/m.txt
            python3 tools/secret_guard.py || true
            git add $D data/incoming/claude/lead_shards data/incoming/claude/overture/bcw_addr_candidates.csv data/incoming/claude/overture/bcg_candidates.csv 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "bc-crown: $(tail -1 /tmp/m.txt | cut -c1-150) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main: its work was not saved"; exit 1; }
          { echo '```'; cat /tmp/l.txt /tmp/m.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
