name: gemini-researcher
# Gemini researches invoicing contacts (buyers) and published contacts (vendors) unattended, with the free Gemini API key.
# tools/research_driver.py asks Gemini one Google-Search-grounded question per task, then fetches the cited pages itself and
# keeps a value only if it is literally on the organisation's own page. Runs alternate between the `gemini` queue (Québec)
# and the `chatgpt` queue (rest of Canada + US). The referee (verify-and-merge) re-checks everything after the commit.
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "gemini (Québec) or chatgpt (rest of Canada + US)"
        default: gemini
      max:
        description: "Maximum tasks this run"
        default: "40"
      kinds:
        description: "Task kinds in order (advanced)"
        default: "verify_buyer_ap,buyer_ap,vendor_contacts"
concurrency:
  group: gemini-researcher
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  research:
    if: vars.GEMINI_ENABLED != 'false'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 70
    env:
      LANE: ${{ inputs.lane || (github.event.schedule == '17 3,9,15,21 * * *' && 'chatgpt' || 'gemini') }}
      MAX: ${{ inputs.max || vars.GEMINI_ROWS_PER_RUN || '40' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Key present?
        id: key
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: echo "ok=$([ -n "$K" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Pick Gemini models that are answering now
        id: models
        if: steps.key.outputs.ok == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREFERRED: ${{ vars.GEMINI_MODEL }}
        run: python3 tools/pick_gemini_model.py
      - name: Research (Gemini proposes, code verifies)
        id: research
        if: steps.key.outputs.ok == 'yes' && steps.models.outputs.model1 != ''
        continue-on-error: true
        timeout-minutes: 55
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS: ${{ steps.models.outputs.models }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '8' }}
          KINDS: ${{ inputs.kinds }}
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null 2>&1 || true
          python3 tools/research_driver.py --lane "$LANE" --max "$MAX" --minutes 50 --kinds "${KINDS:-verify_buyer_ap,buyer_ap,vendor_contacts}" | tee research.log
      - name: Commit results (conflict-free, lane paths only) + health note
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          M1: ${{ steps.models.outputs.model1 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(grep -h "SUMMARY" research.log 2>/dev/null | tail -1 | sed 's/.*SUMMARY //')
          rows=$(python3 -c "import json,sys; print(json.loads(sys.argv[1] or '{}').get('rows', 0))" "$summary" 2>/dev/null || echo 0)
          if [ "${rows:-0}" = "0" ]; then
            printf '\n## %s from gemini-researcher (automatic health note)\nRun %s (lane %s, model "%s") saved 0 rows. %s\n' \
              "$(date -u '+%F %H:%M')" "$RUN_URL" "$LANE" "$M1" "${summary:-no summary (driver did not run)}" >> coord/inbox/claude.md
          fi
          python3 tools/commit_lane.py "$LANE" "gemini-researcher: run ${{ github.run_id }} lane $LANE ($rows rows)" gemini-researcher
