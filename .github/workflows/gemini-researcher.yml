name: gemini-researcher
# Gemini works its lane unattended (free Gemini API key). Results are committed, then re-verified by the referee.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      extra:
        description: "Optional extra instruction for this run"
        default: ""
concurrency: { group: gemini-researcher, cancel-in-progress: false }
permissions:
  contents: write
  actions: write
jobs:
  research:
    if: vars.GEMINI_ENABLED != 'false'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Key present?
        id: key
        env: { K: "${{ secrets.GEMINI_API_KEY }}" }
        run: echo "ok=$([ -n "$K" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Refresh queue view
        run: python3 tools/next_batch.py > /dev/null
      - name: Gemini researcher
        if: steps.key.outputs.ok == 'yes'
        continue-on-error: true
        timeout-minutes: 34
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          settings: |-
            { "model": { "maxSessionTurns": 250 }, "context": { "fileName": ["GEMINI.md", "AGENTS.md"] } }
          prompt: |-
            You are running unattended in GitHub Actions (run ${{ github.run_id }}). Follow your standing orders in
            prompts/gemini_researcher.md exactly. Get today's date with `date -u +%F`. Max buyers this run: ${{ vars.GEMINI_ROWS_PER_RUN || '15' }}.
            ${{ inputs.extra }}
      - name: Commit lane output (validated; only allowed paths)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          bash tools/commit_lane.sh gemini "gemini research run ${{ github.run_id }}"
