name: verify-and-merge
# The team's referee. On every PR: validate formats, auto-merge data-only PRs. On main: re-fetch every cited
# evidence page, keep only verified values, refresh NEXT.md + STATUS_BOARD.md, create cross-verification tasks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths: ["data/incoming/**", "coord/tasks/**", "coord/source_registry.csv"]
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate and decide
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR" --name-only > changed.txt
          decision=$(python3 tools/automerge_check.py < changed.txt)
          ok=yes
          { echo "### Automatic check"; echo; echo "Decision: \`$decision\`"; echo; echo '```'; } > report.md
          for f in $(grep -E '^data/incoming/.*\.csv$' changed.txt); do [ -f "$f" ] && { python3 tools/validate_returns.py "$f" >> report.md 2>&1 || ok=no; }; done
          for f in $(grep -E '^data/incoming/.*records_.*\.jsonl(\.gz)?$' changed.txt); do [ -f "$f" ] && { python3 tools/validate_records.py "$f" >> report.md 2>&1 || ok=no; }; done
          echo '```' >> report.md
          echo "Evidence pages are re-fetched after merge; only values found on the cited page enter the dataset." >> report.md
          echo "decision=$decision" >> "$GITHUB_OUTPUT"; echo "ok=$ok" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR" --body-file report.md || true
      - name: Auto-merge data-only PR (same-repo branches only; fork PRs always wait for review)
        if: steps.v.outputs.decision == 'automerge' && steps.v.outputs.ok == 'yes' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr ready "$PR" || true
          gh pr merge "$PR" --squash --delete-branch && gh workflow run verify-and-merge.yml --ref main
          # new source records -> rebuild now; a finished Jules task -> start the next Jules task right away
          if grep -qE '^data/incoming/.*records_.*\.jsonl(\.gz)?$' changed.txt; then gh workflow run rebuild.yml --ref main || true; fi
          case "$TITLE" in "[jules]"*) gh workflow run jules-builder.yml --ref main || true;; esac
      - name: Flag for review
        if: steps.v.outputs.decision != 'automerge' || steps.v.outputs.ok != 'yes' || github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create needs-review --color FBCA04 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-review || true

  verify-on-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: main-writer, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      # 2026-11-10: no cache of fetched pages any more. The cache had grown to 300,000 files / 5.6 GB and its save step had failed since 11:26Z
      # ("Maximum call stack size exceeded"), so every run fetched every page newer than that again (80,953 pages for 4,200 new rows at 13:59Z,
      # 65-105 minutes a run). What a run needs from the earlier ones is the verdict, and that is in git: coord/results/verified_ledger.csv
      # (tools/ingest_results.py: a verdict stands for 45-59 days, 7 for "not on the page", 3 for "page could not be opened"). A run reads the
      # pages of the new rows and of the rows whose term has come.
      - name: Verify evidence, refresh queues and board, commit (regenerated on the latest main until the push wins)
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_BUDGET_SECONDS: "3600"
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) > /dev/null 2>&1 || true
          (pip install -q --break-system-packages pypdf || pip install -q pypdf) > /dev/null 2>&1 || true
          which pdftotext || echo "pdftotext missing; pypdf fallback"
          git config user.name "verifier-bot"; git config user.email "verifier-bot@users.noreply.github.com"
          export VERIFY_DEADLINE=$(( $(date +%s) + VERIFY_BUDGET_SECONDS ))  # one budget for the ingest
          # 2026-11-09 03:20Z: the evidence re-check takes up to 40 min; re-running it on every push race meant no verification landed on main for
          # five hours. The ingest runs ONCE; the push loop restores its outputs onto the latest main and only redoes the cheap queue / board steps.
          git fetch -q origin main && git reset -q --hard origin/main
          python3 tools/ingest_results.py > /dev/null
          python3 tools/export_orgs.py > /dev/null || true
          # 2026-11-10: team_buyers.jsonl.gz is rewritten whole on every run and cannot be stored as a difference (61 versions = 1.0 GB of git objects
          # in 24 hours). It is uploaded as an asset of the state release; git keeps one manifest line (coord/STATE_ASSETS.json, tools/state_io.py)
          rm -f /tmp/state_entries.json
          python3 tools/state_io.py publish coord/results/team_buyers.jsonl.gz --save /tmp/state_entries.json || echo "::warning::team_buyers.jsonl.gz was not published as a release asset this run"
          rm -rf /tmp/gen && mkdir -p /tmp/gen && cp -r coord/results /tmp/gen/results && cp coord/INGEST_REPORT.md /tmp/gen/ 2>/dev/null || true
          [ -f coord/source_registry.csv ] && cp coord/source_registry.csv /tmp/gen/ || true
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main
            # only the verifier's own outputs come back from the snapshot: coord/results/ranked/* and coverage_history.csv belong to the ranker, which may
            # have published a newer build meanwhile (06:41Z: a verifier push reverted the 06:36Z build to the 05:32Z one)
            rsync -a --delete --exclude ranked --exclude coverage_history.csv /tmp/gen/results/ coord/results/ && cp /tmp/gen/INGEST_REPORT.md coord/ 2>/dev/null || true
            # 2026-11-13: the ingest only APPENDS sources to the registry; copying its snapshot over main reverted every edit made meanwhile by the
            # other lanes (rows added and statuses changed at 01:5xZ were undone by the 02:35Z verifier push). Main's file stays; the rows the
            # ingest added (source keys main does not have) are appended to it.
            if [ -f /tmp/gen/source_registry.csv ]; then
              python3 - <<'PY'
          import csv, io
          main_p, snap_p = "coord/source_registry.csv", "/tmp/gen/source_registry.csv"
          main = list(csv.reader(open(main_p, encoding="utf-8", newline=""))) if __import__("os").path.exists(main_p) else []
          snap = list(csv.reader(open(snap_p, encoding="utf-8", newline="")))
          have = {r[0] for r in main if r}
          add = [r for r in snap[1:] if r and r[0] not in have]
          if not main:
              main = snap[:1]
          if add:
              out = io.StringIO(); csv.writer(out, lineterminator="\n").writerows(main + add)
              open(main_p, "w", encoding="utf-8", newline="").write(out.getvalue())
          print("source registry: %d rows on main, %d added by the ingest" % (len(main) - 1, len(add)))
          PY
            fi
            python3 tools/next_batch.py > /dev/null
            python3 tools/status_board.py > /dev/null
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add coord/results coord/NEXT.md coord/STATUS_BOARD.md coord/INGEST_REPORT.md coord/tasks coord/source_registry.csv
            if [ -s /tmp/state_entries.json ]; then  # the file is a release asset now: the manifest line is committed, the file is not
              python3 tools/state_io.py restore /tmp/state_entries.json && git add coord/STATE_ASSETS.json
              git rm -q --cached --ignore-unmatch coord/results/team_buyers.jsonl.gz
            fi
            git diff --cached --quiet && break
            git commit -q -m "verifier: evidence re-checked, board refreshed [skip ci]"
            git push -q origin HEAD:main && break
            echo "push attempt $i lost the race; retrying on the new head"
            sleep $((RANDOM % 10 + 3))
          done
          # a merge that could not be pushed is a failed job (2026-11-10: twelve refused pushes ended a crawl's merge green)
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main (see the push errors above): its work was not saved"; exit 1; }
      - name: Start overdue workflows (GitHub's timer is best-effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/dispatch_overdue.sh
