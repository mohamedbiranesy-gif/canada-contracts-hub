name: member-live
# Members of Canadian chambers of commerce, boards of trade and trade associations, read from the bodies' own live directories (the members
# pay dues; the directory prints each member's name, address, telephone and website). The row factory reads the member pages the Common Crawl
# archive happens to hold; this reads the directories themselves, complete and current (tools/member_live.py).
#   crawl    : /list/searchalpha/<letter> of every known directory host -> each member page not read before -> leads (same files and same
#              merge as the row factory: tools/cc_clients.py merge); the row factory's mailbox crawl then reads each member's own site
#   discover : probe the .ca domains named like a chamber / association for a directory of the same family -> claude_member_hosts.csv
#   index-hosts    : every host with /list/member/ pages in the Common Crawl index, on any domain (2026-11-10: 1,926 hosts, 401,055 member pages
#                    in one crawl; 42 on .ca) -> claude_member_index_hosts.csv
#   discover-index : each of those hosts is read once (its /list/ page, then the body's home page when the directory prints no address); a body
#                    whose own page prints a Canadian postal address joins claude_member_hosts.csv, a directory abroad is noted and not asked again
# One request queue per runner towards the directory platform (2 requests per second), robots.txt respected. No AI, no search engine.
on:
  # schedule:   # stopped 2026-11-13 by the owner: coord/ACTIONS_PAUSED
    # - cron: "53 4 * * *"
    # - cron: "53 16 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "crawl | discover | index-hosts | discover-index"
        default: "crawl"
      crawl:
        description: "index-hosts: Common Crawl id (auto = the newest)"
        default: "auto"
      minutes:
        description: "minutes per runner"
        default: "150"
permissions:
  contents: write
  actions: write
concurrency:
  group: member-live-${{ inputs.stage || 'crawl' }}
  cancel-in-progress: false
env:
  STAGE: ${{ inputs.stage || 'crawl' }}
  MINUTES: ${{ inputs.minutes || '150' }}
jobs:
  crawl:
    if: ${{ (inputs.stage || 'crawl') == 'crawl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix: { k: [0, 1, 2, 3] }   # 2026-11-10: 4 runners (was 2) — the index scan trebles the directories; each runner keeps its own queue of 2 requests a second
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Read the live member directories
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          python3 tools/member_live.py crawl --shard ${{ matrix.k }}/4 --minutes $M --workers 8
      - uses: actions/upload-artifact@v4
        with: { name: "ml-${{ matrix.k }}", path: out/, retention-days: 3 }

  merge:
    needs: crawl
    if: ${{ always() && needs.crawl.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "ml-*", path: shards, merge-multiple: true }
      - name: Union the leads with main and commit (the row factory's own merge)
        run: |
          ls -la shards | head -20 || true
          git config user.name "member-live"; git config user.email "member-live@users.noreply.github.com"
          STAMP=$(date -u +%Y%m%dT%H%M%S)   # this merge writes its changes as shards of lead_shards/ (tools/lead_store.py)
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -q -fd data/incoming/claude/lead_shards
            python3 tools/cc_clients.py merge shards --stamp "$STAMP" --engine ml | tee /tmp/merge.txt
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add data/incoming/claude/lead_shards 2>/dev/null || true
            for f in claude_buyer_leads_cc.csv claude_lead_details_cc.jsonl.gz claude_cc_extract_done.tsv claude_cc_leads_noaddr.jsonl.gz; do [ -e "data/incoming/claude/$f" ] && git add "data/incoming/claude/$f"; done
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "member-live: members named in the live directories of Canadian chambers and associations ($(tail -1 /tmp/merge.txt | cut -c1-110)) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          # a merge that could not be pushed is a failed job (2026-11-10: twelve refused pushes ended a crawl's merge green)
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main (see the push errors above): its work was not saved"; exit 1; }
          cat /tmp/merge.txt >> "$GITHUB_STEP_SUMMARY"

  discover:
    if: ${{ (inputs.stage || 'crawl') == 'discover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix: { k: [0, 1] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Probe chamber / association domains for a directory
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          python3 tools/member_live.py discover --shard ${{ matrix.k }}/2 --minutes $M --workers 30
      - uses: actions/upload-artifact@v4
        with: { name: "mh-${{ matrix.k }}", path: out/, retention-days: 3 }

  index_hosts:
    if: ${{ inputs.stage == 'index-hosts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Hosts with member pages in the archive index (any domain)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pip install -q duckdb
          git config user.name "member-live"; git config user.email "member-live@users.noreply.github.com"
          python3 tools/member_live.py index-hosts --crawl "${{ inputs.crawl || 'auto' }}" | tee /tmp/i.txt
          cp data/incoming/claude/claude_member_index_hosts.csv /tmp/index_hosts.csv
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/index_hosts.csv data/incoming/claude/claude_member_index_hosts.csv   # single writer: this job
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add data/incoming/claude/claude_member_index_hosts.csv
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "member-live: index hosts ($(tail -1 /tmp/i.txt | cut -c1-110)) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          # a merge that could not be pushed is a failed job (2026-11-10: twelve refused pushes ended a crawl's merge green)
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main (see the push errors above): its work was not saved"; exit 1; }
          cat /tmp/i.txt >> "$GITHUB_STEP_SUMMARY"
          { [ -f "$GITHUB_WORKSPACE/coord/ACTIONS_PAUSED" ] || gh api "repos/${GITHUB_REPOSITORY}/contents/coord/ACTIONS_PAUSED" --silent 2>/dev/null; } && echo "not started (coord/ACTIONS_PAUSED: the project is stopped)" || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/member-live.yml/dispatches" -f ref=main -f "inputs[stage]=discover-index" || true

  discover_index:
    if: ${{ inputs.stage == 'discover-index' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix: { k: [0, 1] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Whose directory is each index host, and is the body in Canada
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          python3 tools/member_live.py discover-index --shard ${{ matrix.k }}/2 --minutes $M --workers 8
      - uses: actions/upload-artifact@v4
        with: { name: "mh-${{ matrix.k }}", path: out/, retention-days: 3 }

  merge_hosts:
    needs: [discover, discover_index]
    if: ${{ always() && (needs.discover.result == 'success' || needs.discover.result == 'failure' || needs.discover_index.result == 'success' || needs.discover_index.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "mh-*", path: shards, merge-multiple: true }
      - name: Directory hosts -> main
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "member-live"; git config user.email "member-live@users.noreply.github.com"
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/member_live.py merge-hosts shards | tee /tmp/h.txt
            # the bodies' own postal addresses read by discover-index (the Canada proof of each new directory) join the address store
            if ls shards/cc_vendor_addr_*.jsonl > /dev/null 2>&1; then python3 tools/cc_clients.py merge-addr shards | tail -1; git add data/incoming/claude/claude_cc_vendor_addr.jsonl.gz data/incoming/claude/claude_cc_addr_done.tsv 2>/dev/null || true; fi
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add data/incoming/claude/claude_member_hosts_judged.tsv 2>/dev/null || true
            git add data/incoming/claude/claude_member_hosts.csv data/incoming/claude/claude_member_hosts.csv.probed 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "member-live: directory hosts ($(tail -1 /tmp/h.txt | cut -c1-110)) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          # a merge that could not be pushed is a failed job (2026-11-10: twelve refused pushes ended a crawl's merge green)
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main (see the push errors above): its work was not saved"; exit 1; }
          cat /tmp/h.txt >> "$GITHUB_STEP_SUMMARY"
          { [ -f "$GITHUB_WORKSPACE/coord/ACTIONS_PAUSED" ] || gh api "repos/${GITHUB_REPOSITORY}/contents/coord/ACTIONS_PAUSED" --silent 2>/dev/null; } && echo "not started (coord/ACTIONS_PAUSED: the project is stopped)" || gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/member-live.yml/dispatches" -f ref=main -f "inputs[stage]=crawl" || true
