name: dns-services
# The paid services an organisation's own public DNS records show (owner 2026-11-09 23:41 EST: "some Canadian entity receives money for a
# service they provided, and that relationship is established online … think like that"):
#   MX  -> who receives its mail          NS  -> who serves its zone (web host, registrar, managed DNS)
#   SPF -> whose servers may send its mail (the host of its site / mail)          TXT -> verification records of business accounts
#   A   -> a store on Shopify's storefront addresses (Shopify Inc., Ottawa)
# lookup : NS / TXT / MX / A of every domain the scans know (delivered rows, leads, linking sites, OpenStreetMap, .ca) that was not looked up
#          yet, through public resolvers, 500 queries per second per runner                                   (tools/dns_services.py lookup)
# merge  : records -> main (append-only, data/incoming/claude/credit_scan/dns_*.gz) + the table of providers by number of client domains;
#          then a credit-scan cycle: its vendor step proves where each provider is (its own site prints a Canadian address) and its merge
#          makes the leads (tools/credit_scan.py merge -> dns_services.leads)
# sweep  : (mode=sweep) every domain of Common Crawl's domain graph on the endings most stores use (63 M) — two questions each: is it on
#          Shopify's storefront network (address record), and is its zone served by a provider that already yields leads (name servers:
#          whc.ca, webnames.ca, easydns.com, hover.com … — data/incoming/claude/credit_scan/sweep_ns_watch.txt, rewritten by the merge)? Only
#          the hits are kept; each shard notes its place in the list and the run after it goes on from there, until the list is done and
#          the part swept before the second question existed is caught up (the merge starts the next run).   (tools/dns_services.py sweep)
# hosts  : (mode=hosts) stores that live on a subdomain (shop.brand.com, store.brand.com, us.brand.com …): the 7 M three-label host names the
#          host-level web graph holds for ordinary domains on the same endings and .ca, one question each (the address record); a host on
#          Shopify's storefront network whose domain is not a known store is kept. Its own concurrency group: it runs beside the sweep and
#          starts its next run until its eight shards are done.                                             (tools/dns_services.py hosts)
# Nothing here contacts the organisations' own servers. No AI, no search engine, no Mac.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "parallel runners (1-8)"
        default: "4"
      minutes:
        description: "minutes per runner"
        default: "150"
      limit:
        description: "at most this many domains per runner (0 = no limit)"
        default: "0"
      mode:
        description: "lookup | sweep | hosts"
        default: "lookup"
permissions:
  contents: write
  actions: write
# one group per mode: a group holds one waiting run, and the sweep's own next run used to push a waiting lookup out
concurrency:
  group: dns-services-${{ inputs.mode || 'lookup' }}
  cancel-in-progress: false
env:
  SHARDS: ${{ inputs.shards || '4' }}
  MINUTES: ${{ inputs.minutes || '150' }}
  LIMIT: ${{ inputs.limit || '0' }}
  MODE: ${{ inputs.mode || 'lookup' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      stamp: ${{ steps.m.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - id: m
        run: |
          if [ "$MODE" = "sweep" ]; then   # the sweep shards that still have work, least advanced first
            echo "matrix=$(python3 tools/dns_services.py sweep-plan --limit "$(python3 -c "import os; print(max(1,min(8,int(os.environ['SHARDS']))))")")" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "hosts" ]; then
            echo "matrix=$(python3 tools/dns_services.py hosts-plan --limit "$(python3 -c "import os; print(max(1,min(8,int(os.environ['SHARDS']))))")")" >> "$GITHUB_OUTPUT"
          else
            python3 -c "import os; n=max(1,min(8,int(os.environ['SHARDS']))); print('matrix=' + str(list(range(n))))" >> "$GITHUB_OUTPUT"
          fi
          echo "stamp=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  lookup:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install -q dnspython
      - name: A resolver on this runner that forwards over TLS to the public resolvers
        run: |
          # 2026-11-10, four measurements (dns-diag.yml; coord/DECISIONS.md 23:00Z). A runner that sends each question as its own packet
          # flow — through its own recursive resolver, or straight to the public resolvers — gets 50-90 answers a second and loses the
          # rest (the day's lookups: 43 % "no answer"; the sweep: 55-61 %). The same questions inside a few long-lived TLS connections:
          # 98 % answered at 254 a second. So the runner's resolver no longer asks the zones itself: it forwards every question over TLS
          # (port 853, certificates checked) to Cloudflare, Google and Quad9 and keeps those connections open.
          sudo apt-get install -y -q unbound >/dev/null 2>&1 || true
          sudo systemctl stop unbound 2>/dev/null || true
          printf '%s\n' 'server:' '  interface: 127.0.0.1' '  port: 5353' '  access-control: 127.0.0.0/8 allow' '  do-ip6: no' '  num-threads: 4' \
            '  msg-cache-size: 256m' '  rrset-cache-size: 512m' '  num-queries-per-thread: 4096' '  outgoing-num-tcp: 64' '  module-config: "iterator"' \
            '  tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"' '  hide-identity: yes' '  hide-version: yes' '  verbosity: 0' \
            'forward-zone:' '  name: "."' '  forward-tls-upstream: yes' '  forward-addr: 1.1.1.1@853#cloudflare-dns.com' '  forward-addr: 1.0.0.1@853#cloudflare-dns.com' \
            '  forward-addr: 8.8.8.8@853#dns.google' '  forward-addr: 8.8.4.4@853#dns.google' '  forward-addr: 9.9.9.9@853#dns.quad9.net' | sudo tee /etc/unbound/unbound.conf >/dev/null
          sudo unbound-checkconf /etc/unbound/unbound.conf || true
          sudo unbound -c /etc/unbound/unbound.conf || sudo systemctl start unbound || true
          sleep 3; (ss -lun | grep 5353) || echo "unbound is not listening"
      - name: Look up the public DNS records of each domain
        run: |
          M=$(( MINUTES > 170 ? 170 : MINUTES ))
          if [ "$MODE" = "sweep" ]; then
            # 170 domains a second per runner: about 300 questions a second (the address of each, the name servers of those that answer) —
            # the rate measured to be answered at 98 % through the forwarding resolver. tools/dns_services.py stops the run in place when
            # a batch goes unanswered.
            python3 tools/dns_services.py sweep --shard ${{ matrix.k }}/8 --minutes $M --workers 300 --resolver 127.0.0.1:5353 --qps 170
          elif [ "$MODE" = "hosts" ]; then
            python3 tools/dns_services.py hosts --shard ${{ matrix.k }}/8 --minutes $M --workers 300 --resolver 127.0.0.1:5353 --qps 300
          else
            python3 tools/dns_services.py lookup --shard ${{ matrix.k }}/$SHARDS --minutes $M --workers 300 --limit "$LIMIT" --resolver 127.0.0.1:5353 --qps 300
          fi
          ls -la out | head; head -c 600 out/dns_${{ matrix.k }}.jsonl || true
      - uses: actions/upload-artifact@v4
        with: { name: "dns-${{ matrix.k }}", path: out/, retention-days: 3 }

  merge:
    needs: [plan, lookup]
    if: ${{ always() && needs.lookup.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "dns-*", path: shards, merge-multiple: true }
      - name: Records -> main; the provider table; start a credit-scan cycle (provider proofs + leads)
        env: { GH_TOKEN: "${{ github.token }}", STAMP: "${{ needs.plan.outputs.stamp }}" }
        run: |
          ls -la shards | head -20 || true
          git config user.name "dns-services"; git config user.email "dns-services@users.noreply.github.com"
          for i in $(seq 1 12); do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -q -fd data/incoming/claude/credit_scan
            python3 tools/dns_services.py merge shards --stamp "${STAMP}" | tee /tmp/d.txt
            python3 tools/secret_guard.py || true   # no pre-signed storage address, no key-shaped token in what is committed
            git add data/incoming/claude/credit_scan 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "dns-services: public DNS records ($(tail -1 /tmp/d.txt | cut -c1-110)) [skip ci]"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 12 + 3))
          done
          # a merge that could not be pushed is a failed job (2026-11-10: twelve refused pushes ended a crawl's merge green)
          git fetch -q origin main 2>/dev/null; git merge-base --is-ancestor HEAD origin/main || { echo "::error::this run's commit could not be pushed to main (see the push errors above): its work was not saved"; exit 1; }
          cat /tmp/d.txt >> "$GITHUB_STEP_SUMMARY"
          head -60 data/incoming/claude/credit_scan/dns_providers_seen.csv >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$MODE" = "sweep" ]; then
            # the list is long (63 M domains): the next run starts by itself until every shard has reached the end
            left=$(python3 tools/dns_services.py sweep-plan --after shards | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            echo "sweep shards with work left: $left"
            if [ "${left:-0}" != "0" ]; then gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/dns-services.yml/dispatches" -f ref=main -f "inputs[mode]=sweep" -f "inputs[shards]=4" -f "inputs[minutes]=$MINUTES" || true; fi
          elif [ "$MODE" = "hosts" ]; then
            left=$(python3 tools/dns_services.py hosts-plan --after shards | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
            echo "host sweep shards with work left: $left"
            # two runners at a time: the list is short (7 M hosts) and the mailbox crawl needs the runners more
            if [ "${left:-0}" != "0" ]; then gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/dns-services.yml/dispatches" -f ref=main -f "inputs[mode]=hosts" -f "inputs[shards]=2" -f "inputs[minutes]=$MINUTES" || true; fi
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/credit-scan.yml/dispatches" -f ref=main -f "inputs[stage]=cycle" || true
          fi
